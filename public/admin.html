<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Панел — Men In A Movie</title>
<meta name="theme-color" content="#F6C92B">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&family=Oswald:wght@400;500;600&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--y:#F6C92B;--bg:#0A0908;--card:#141210;--card2:#1C1916;--tx:#F2F0EB;--tx2:#A6A196;--line:#2A2723;--black:#1A1600}
*{box-sizing:border-box;border-radius:0!important}
html,body{margin:0;padding:0;background:#0D0C0A}
body{color:var(--tx);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.7}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.logo{font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;letter-spacing:-.03em;text-transform:uppercase}
.prose{font-size:16px;line-height:1.75}
.prose h2{font-family:Oswald,sans-serif;font-weight:600;font-size:20px;margin:1.4em 0 .4em}
.prose blockquote{border-left:4px solid var(--y);margin:1.2em 0;padding-left:14px;color:var(--tx2)}
.prose a{color:var(--y)}
.prose figure{margin:1.4em 0}
.prose figcaption{font-size:13px;color:var(--tx2);margin-top:5px}
.answer{border-left:4px solid var(--y);padding-left:14px;margin:0 0 18px;font-size:17px}
/* ================= АДМИН ПАНЕЛ V2 ================= */
#adm{position:fixed;inset:0;z-index:900;background:#0D0C0A;color:var(--tx);display:none;overflow:auto;font-size:15px}
#adm.on{display:block}
#adm *{border-radius:0!important}
.a-top{position:sticky;top:0;z-index:5;background:var(--y);color:var(--black);display:flex;align-items:center;gap:14px;padding:10px 16px}
.a-top .logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--black);font-size:17px}
.a-top .logo-mark{height:26px;width:auto;display:block;color:var(--black)}
.a-top .logo-mark path,.a-top .logo-mark rect{fill:currentColor}
.a-top .btxt{font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;font-size:14px}
.a-top .sp{flex:1}
.a-who{font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.07em;text-transform:uppercase}
.a-save{font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border:1px solid rgba(0,0,0,.3)}
.a-save:empty{display:none;padding:0;border:0}
.a-top .a-tosite{color:var(--black);border-color:rgba(0,0,0,.35)}
.a-top .a-tosite:hover{border-color:var(--black);background:rgba(0,0,0,.08);color:var(--black)}
.a-wrap{display:flex;min-height:calc(100vh - 46px)}
.a-side{flex:0 0 210px;background:#131210;border-right:1px solid var(--line);padding:14px 0}
.a-side a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 16px;font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);cursor:pointer}
.a-side a:hover{background:#1C1916;color:var(--tx)}
.a-side a.on{background:var(--y);color:var(--black)}
.a-side .dot{width:7px;height:7px;background:var(--y);display:inline-block}
.a-main{flex:1;min-width:0;padding:20px 22px 60px}
.a-main h2{font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;font-size:22px;color:var(--y);margin:0 0 14px}
.a-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.a-btn{background:none;border:1px solid var(--line);color:var(--tx);font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:8px 14px;cursor:pointer}
.a-btn:hover{border-color:var(--y);color:var(--y)}
.a-sel{appearance:none;-webkit-appearance:none;-moz-appearance:none;background-color:#0A0908;border:1px solid var(--line);color:var(--tx);font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:8px 30px 8px 14px;cursor:pointer;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="%23A6A196" stroke-width="1.6" fill="none"/></svg>');background-repeat:no-repeat;background-position:right 12px center}
.a-sel:hover{border-color:var(--y)}
.a-btn.pri{background:var(--y);border-color:var(--y);color:var(--black)}
.a-btn.dan{border-color:#7a2320;color:#e07a76}
.a-row{display:flex;align-items:center;gap:12px;background:#161412;border:1px solid var(--line);padding:9px 12px;margin-bottom:6px}
.a-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-row .sub{color:var(--tx2);font-size:12px;white-space:nowrap}
.a-row img{width:64px;height:36px;object-fit:cover;background:#0A0908}
.a-row img.p{width:26px;height:39px}
.cal-dot{width:8px;height:8px;flex:none;border-radius:50%!important;background:var(--tx2)}
.cal-dot.up{background:#3ac26a}
.cal-dot.past{background:#5a5650}
.st{font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);color:var(--tx2);cursor:default;background:none}
.st.pub{background:var(--y);color:var(--black);border-color:var(--y);cursor:pointer}
.st.hid{background:#7a2320;color:#fff;border-color:#7a2320;cursor:pointer}
.st.rev{background:#2b2a12;color:var(--y);border-color:#5a5320}
.a-form{display:grid;gap:14px;max-width:900px}
.a-f label{display:block;font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2);margin-bottom:5px}
.a-f input,.a-f select,.a-f textarea{width:100%;background:#0A0908;border:1px solid var(--line);color:var(--tx);font:inherit;font-size:15px;padding:9px 11px}
.a-f textarea{min-height:220px;line-height:1.6;resize:vertical;font-family:Manrope,sans-serif}
.a-f select{appearance:none;-webkit-appearance:none;-moz-appearance:none;cursor:pointer;padding-right:32px;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="%23A6A196" stroke-width="1.6" fill="none"/></svg>');background-repeat:no-repeat;background-position:right 11px center}
.a-f input:focus,.a-f textarea:focus,.a-f select:focus{outline:0;border-color:var(--y)}
.a-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.a-note{color:var(--tx2);font-size:12px;margin-top:5px}
.a-warn{color:#e0b34a;font-size:12px;margin-top:5px}
.a-img{border:1px dashed var(--line);padding:10px;text-align:center;color:var(--tx2);font-size:13px}
.a-img img{max-height:170px;margin:0 auto 8px;object-fit:contain}
.tagbox{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;max-height:132px;overflow-y:auto;padding-right:4px}
.tagbox span{border:1px solid var(--line);color:var(--y);font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;cursor:pointer}
.tagbox span:hover{border-color:var(--y)}
.tagbox span.on{background:var(--y);color:var(--black);border-color:var(--y)}
.tagbox .tagdel{border:0;background:none;color:inherit;cursor:pointer;font:inherit;font-weight:900;padding:0 0 0 7px;opacity:.7}
.tagbox .tagdel:hover{opacity:1;color:#e07a76}
.a-tools{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.a-tools button{background:#161412;border:1px solid var(--line);color:var(--tx2);font-size:12px;padding:5px 9px;cursor:pointer;font-family:Oswald,sans-serif;letter-spacing:.05em}
.a-tools button:hover{color:var(--y);border-color:var(--y)}
.a-prev{border:1px solid var(--line);padding:14px;background:#0A0908;max-height:340px;overflow:auto}
.a-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.a-stat{background:#161412;border:1px solid var(--line);padding:12px 14px}
.a-stat b{display:block;font-family:Oswald,sans-serif;font-size:26px;color:var(--y);font-weight:500}
.a-stats-cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.a-stats-cols h3{font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);margin:0 0 10px}
.a-stats-list{display:flex;flex-direction:column;gap:6px}
.a-stats-row{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;background:#161412;border:1px solid var(--line);overflow:hidden}
.a-stats-bar{position:absolute;left:0;top:0;bottom:0;background:rgba(246,201,43,.14);z-index:0}
.a-stats-title{position:relative;z-index:1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.a-stats-kind{position:relative;z-index:1;font-family:Oswald,sans-serif;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);flex:none}
.a-stats-n{position:relative;z-index:1;font-family:Oswald,sans-serif;font-weight:600;color:var(--y);flex:none;min-width:26px;text-align:right}
@media(max-width:700px){.a-stats-cols{grid-template-columns:1fr}}
.a-pending{border:2px solid var(--y);padding:12px 14px;margin-bottom:18px}
.a-pending h3{margin:0 0 8px;font-family:Oswald,sans-serif;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--y)}
.a-login{max-width:360px;margin:14vh auto;background:#131210;border:1px solid var(--line);padding:24px}
.a-login h2{font-size:20px}
.a-msg{padding:8px 12px;border:1px solid var(--line);color:var(--tx2);font-size:13px;margin-bottom:12px}
.a-msg.ok{border-color:#2f5c2b;color:#9ed08f}
.a-msg.err{border-color:#7a2320;color:#e07a76}
@media(max-width:800px){.a-wrap{flex-direction:column}.a-side{flex:none;display:flex;overflow-x:auto}.a-side a{white-space:nowrap}.a-cols{grid-template-columns:1fr}}

/* ============ ПАНЕЛ V3 — нова рамка, списъци и редактор (календарният списък по-долу остава непроменен) ============ */
:root{--card3:#201C18;--line2:#332E28;--tx3:#6E695F;--ok:#3ac26a}
.a-shell{display:flex;max-width:1480px;margin:0 auto}
.a-nav{flex:0 0 214px;position:sticky;top:46px;align-self:flex-start;height:calc(100vh - 46px);overflow-y:auto;
  background:#131210;border-right:1px solid var(--line);padding:14px 0}
.a-nav-sec{padding:0 10px}
.a-nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;color:var(--tx2);cursor:pointer;font-family:Oswald,sans-serif;
  font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:1px}
.a-nav a svg{width:16px;height:16px;flex:none}
.a-nav a:hover{background:#1C1916;color:var(--tx)}
.a-nav a.on{background:var(--y);color:var(--black)}
.a-nav a .nsp{flex:1}
.a-nav a .ndot{width:6px;height:6px;background:var(--y);flex:none}
.a-nav a.on .ndot{background:var(--black)}
.a-nav-div{height:1px;background:var(--line);margin:10px 12px}
.a-content{flex:1;min-width:0;padding:30px 34px 70px;max-width:1120px}
.a-content h2{font-family:Oswald,sans-serif;font-weight:600;font-style:normal;font-size:24px;color:var(--tx);text-transform:none;letter-spacing:0;margin:0 0 4px}
.a-sub{color:var(--tx2);font-size:13px;margin:0 0 20px}

.pbtn{background:none;border:1px solid var(--line2);color:var(--tx2);font-family:Oswald,sans-serif;font-size:11.5px;
  letter-spacing:.05em;text-transform:uppercase;padding:8px 14px;cursor:pointer}
.pbtn:hover{border-color:var(--y);color:var(--y)}
.pbtn.pri{background:var(--y);border-color:var(--y);color:var(--black)}
.pbtn.pri:hover{background:#d9ad1c;border-color:#d9ad1c}
.pbtn.sm{padding:5px 10px;font-size:10.5px}
.pbtn.dan{border-color:#5a2320;color:#e07a76}

/* табло */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px;margin-bottom:22px}
.stat-card{background:var(--card3);border:1px solid var(--line);padding:15px 16px 13px}
.stat-card b{display:block;font-family:Oswald,sans-serif;font-size:27px;color:var(--y);font-weight:500}
.stat-card span{font-family:Oswald,sans-serif;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--tx2)}
.pending-card2{border:1.5px solid var(--y);background:rgba(246,201,43,.05);padding:14px 16px;margin-bottom:26px}
.pending-card2 h3{margin:0 0 8px;font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--y)}
.pending-row2{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(246,201,43,.14)}
.pending-row2:first-of-type{border-top:0;padding-top:2px}
.pending-row2 .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.pending-row2 .ps{font-family:Oswald,sans-serif;font-size:10px;color:var(--tx3);letter-spacing:.04em;white-space:nowrap}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.two-col h3{font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);margin:0 0 10px}
.rank-row{position:relative;display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--card3);border:1px solid var(--line);margin-bottom:6px;overflow:hidden;cursor:pointer}
.rank-row:hover{border-color:rgba(246,201,43,.35)}
.rank-bar{position:absolute;left:0;top:0;bottom:0;background:rgba(246,201,43,.13);z-index:0}
.rank-t{position:relative;z-index:1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.rank-kind{position:relative;z-index:1;font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);flex:none}
.rank-n{position:relative;z-index:1;font-family:Oswald,sans-serif;color:var(--y);font-weight:600;flex:none;font-size:13px}
.quick-new{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}

/* списък (некалендарни видове) */
.p-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.p-toolbar input,.p-toolbar select{background:var(--card3);border:1px solid var(--line2);color:var(--tx);font:inherit;
  font-size:13px;padding:8px 11px}
.p-toolbar .psp{flex:1}
.p-toolbar .pcnt{font-family:Oswald,sans-serif;font-size:11px;color:var(--tx3);letter-spacing:.04em}
.p-row{display:flex;align-items:center;gap:13px;background:var(--card3);border:1px solid var(--line);padding:9px 12px;margin-bottom:7px;cursor:pointer}
.p-row:hover{border-color:rgba(246,201,43,.4)}
.p-row img{width:56px;height:34px;flex:none;object-fit:cover;background:var(--card2);display:block}
.p-row img.p{width:24px;height:36px}
.p-row .pinfo{flex:1;min-width:0}
.p-row .pttl{font-size:13.5px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-row .pmeta{font-family:Oswald,sans-serif;font-size:10.5px;color:var(--tx3);letter-spacing:.03em;margin-top:2px}
.rpill{font-family:Oswald,sans-serif;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--line2);color:var(--tx2);flex:none}
.rpill.published{background:var(--y);color:var(--black);border-color:var(--y)}
.rpill.hidden{background:#3a1614;color:#e07a76;border-color:#5a2320}
.rpill.review{background:#2b2a12;color:var(--y);border-color:#5a5320}
.p-chev{color:var(--tx3);flex:none;font-size:15px}

/* редактор */
.ed-topline{position:sticky;top:46px;z-index:15;background:#0D0C0A;display:flex;align-items:center;gap:10px;padding:12px 0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ed-crumb{font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.05em;color:var(--tx3);text-transform:uppercase}
.seg2{display:flex;border:1px solid var(--line2)}
.seg2 button{flex:1;background:none;border:0;border-right:1px solid var(--line2);color:var(--tx2);
  font-family:Oswald,sans-serif;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;cursor:pointer}
.seg2 button:last-child{border-right:0}
.seg2 button.on{background:var(--y);color:var(--black)}
.cal-mode-seg{margin:18px 0 0;max-width:420px}

.ed-shell{display:flex;align-items:flex-start;gap:0;margin-top:22px}
.ed-canvas{flex:1;min-width:0;max-width:840px;margin:0 auto;padding:0 0 60px}
.ed-rail{flex:0 0 328px;position:sticky;top:100px;max-height:calc(100vh - 100px);overflow:auto;
  padding:0 4px 40px 26px;border-left:1px solid var(--line)}

.c-title{font-family:Oswald,sans-serif;font-weight:600;font-size:36px;line-height:1.2;letter-spacing:-.01em;
  color:var(--tx);border:0;background:none;outline:0;width:100%;margin:0 0 16px;padding:0}
.c-title::placeholder{color:var(--tx3)}
.c-lede-lbl{font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);margin:0 0 6px}
.c-lede{border-left:3px solid var(--y);border-top:0;border-right:0;border-bottom:0;padding:8px 0 8px 16px;margin:0 0 26px;font-size:16px;line-height:1.6;
  color:var(--tx);width:100%;background:none;resize:vertical;min-height:60px;font-family:inherit;outline:0}
.c-lede::placeholder{color:var(--tx3);font-style:italic}
.float-tools{position:sticky;top:100px;z-index:5;display:inline-flex;gap:2px;background:var(--card2);
  border:1px solid var(--line2);box-shadow:0 8px 24px rgba(0,0,0,.4);padding:4px;margin:0 0 8px}
.float-tools button{background:none;border:0;color:var(--tx2);min-width:28px;height:28px;cursor:pointer;font-family:Oswald,sans-serif;font-size:12.5px;padding:0 6px}
.float-tools button:hover{color:var(--y);background:rgba(246,201,43,.08)}
.c-body{width:100%;background:none;border:0;outline:0;font-size:16.5px;line-height:1.8;color:var(--tx);
  min-height:340px;resize:vertical;font-family:Manrope,sans-serif;padding:0}
.c-body::placeholder{color:var(--tx3)}
.c-foot{display:flex;gap:18px;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
  font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.05em;color:var(--tx3)}

.ed-sec{border:1px solid var(--line);margin-bottom:12px;background:var(--card3)}
.ed-sec-h{display:flex;align-items:center;gap:9px;padding:12px 13px;cursor:pointer;user-select:none}
.ed-sec-h svg{width:15px;height:15px;flex:none;color:var(--y)}
.ed-sec-h .ed-lbl{flex:1;font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx)}
.ed-sec-h .ed-chev{color:var(--tx3);font-size:11px;transition:transform .15s}
.ed-sec.open .ed-chev{transform:rotate(180deg)}
.ed-sec-b{display:none;padding:0 13px 14px}
.ed-sec.open .ed-sec-b{display:block}
.ed-f{margin-bottom:13px}
.ed-f label{display:block;font-family:Oswald,sans-serif;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);margin-bottom:5px}
.ed-f input,.ed-f select,.ed-f textarea{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--tx);font:inherit;font-size:13.5px;padding:8px 9px}
.ed-f input:focus,.ed-f select:focus,.ed-f textarea:focus{outline:0;border-color:var(--y)}
.ed-f select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:28px;

/* ---------- вход ---------- */
function loginScreen(msg){
  document.getElementById("aBody").innerHTML=
    '<div class="a-login"><h2>Вход в панела</h2>'+
    (msg?'<div class="a-msg err">'+esc2(msg)+'</div>':'')+
    '<div class="a-f" style="margin-bottom:12px"><label>Имейл</label><input id="lgEmail" type="email" autocomplete="username"></div>'+
    '<div class="a-f" style="margin-bottom:14px"><label>Парола</label><input id="lgPass" type="password" autocomplete="current-password"></div>'+
    '<button class="a-btn pri" id="lgGo" style="width:100%">Влез</button>'+
    '<p class="a-note">Празен имейл + резервният ключ също влиза, както досега.</p></div>';
  document.getElementById("aWho").textContent="";
}
function doLogin(){
  var email=(document.getElementById("lgEmail")||{}).value||"";
  var pass=(document.getElementById("lgPass")||{}).value||"";
  if(location.protocol==="file:"){
    A.me={name:"Демо администратор",role:"admin",email:email||"demo"};
    flash("Няма сървър — панелът работи в демонстрационен режим. Промените не се записват."); draw(); return;
  }
  fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify(email?{email:email,password:pass}:{key:pass})})
  .then(function(r){return r.ok?r.json():null;})
  .then(function(u){
    if(!u){ loginScreen("Не влиза. Провери имейла и паролата."); return; }
    A.me={name:u.name||"Администратор",role:u.role||"admin",email:u.email||email,token:u.token};
    if(u.token) try{ sessionStorage.setItem("mim-token",u.token); }catch(e){}
    draw();
  }).catch(function(){ loginScreen("Сървърът не отговаря."); });
}

/* ---------- рамка ---------- */
function draw(){
  document.getElementById("aWho").textContent=A.me.name+" · "+({admin:"администратор",moderator:"модератор",author:"автор"}[A.me.role]||A.me.role);
  var tabs=[["dash","Табло"]];
  Object.keys(TYPES).forEach(function(k){ if(can(k)) tabs.push([k,TYPES[k].label]); });
  var tabs2=[["backup","Резервно копие"]];
  if(isAdmin()){ tabs2.push(["heads","Рубрики"]); tabs2.push(["settings","Настройки"]); tabs2.push(["users","Потребители"]); }
  function navRow(t){
    var n=t[0]!=="dash"&&TYPES[t[0]]?pending(t[0]).length:0;
    return '<a data-tab="'+t[0]+'" class="'+(A.tab===t[0]?"on":"")+'">'+(NAV_ICON[t[0]]||"")+'<span class="nsp">'+esc2(t[1])+'</span>'+(n?'<span class="ndot"></span>':'')+'</a>';
  }
  var side='<div class="a-nav-sec">'+tabs.map(navRow).join("")+'</div><div class="a-nav-div"></div><div class="a-nav-sec">'+tabs2.map(navRow).join("")+'</div>';
  document.getElementById("aBody").innerHTML='<div class="a-shell"><div class="a-nav">'+side+'</div><div class="a-content" id="aMain"></div></div>';
  var m=document.getElementById("aMain");
  var body="";
  if(A.msg) body+='<div class="a-msg '+(A.msg.k||"")+'">'+esc2(A.msg.t)+'</div>';
  if(A.edit) body+=editor();
  else if(A.tab==="dash") body+=dash();
  else if(A.tab==="backup") body+=backupTab();
  else if(A.tab==="heads") body+=headsTab();
  else if(A.tab==="settings") body+=settingsTab();
  else if(A.tab==="users") body+=usersTab();
  else body+=listTab(A.tab);
  m.innerHTML=body;
}
function flash(t,k){ A.msg={t:t,k:k||""}; if(A.open&&A.me) draw(); setTimeout(function(){ if(A.msg&&A.msg.t===t){A.msg=null; if(A.open&&A.me)draw();} },6000); }

function all(k){ return D[k]||(D[k]=[]); }
function pending(k){ return all(k).filter(function(i){return i.status==="review";}); }

/* ---------- табло ---------- */
function dash(){
  var h="";
  if(canPublish()){
    var p=[]; Object.keys(TYPES).forEach(function(k){ pending(k).forEach(function(i){ p.push({k:k,i:i}); }); });
    if(p.length) h+='<div class="pending-card2"><h3>'+p.length+' чакат одобрение</h3>'+p.map(function(x){
      return '<div class="pending-row2"><span class="rpill review">'+esc2(TYPES[x.k].label)+'</span>'+
        '<span class="pt">'+esc2(x.i.t)+'</span>'+
        '<span class="ps">'+esc2(x.i.authorName||"")+' '+esc2(x.i.when||"")+'</span>'+
        '<button class="pbtn sm" data-act="edit" data-k="'+x.k+'" data-id="'+x.i.id+'">Прегледай</button>'+
        '<button class="pbtn sm pri" data-act="approve" data-k="'+x.k+'" data-id="'+x.i.id+'">Одобри</button></div>';
    }).join("")+'</div>';
  }
  h+='<h2>Табло</h2><p class="a-sub">Общ преглед на съдържанието в сайта.</p><div class="stat-grid">'+Object.keys(TYPES).filter(can).map(function(k){
    return '<div class="stat-card"><b>'+all(k).length+'</b><span>'+esc2(TYPES[k].label)+'</span></div>';
  }).join("")+'<div class="stat-card"><b>'+Object.keys(D.tagLabels||{}).length+'</b><span>Тагове</span></div></div>';

  if(A.stats===undefined) loadStats();
  var totalViews=0,totalLikes=0;
  if(A.stats){
    Object.keys(A.stats.views||{}).forEach(function(k){totalViews+=A.stats.views[k]||0;});
    Object.keys(A.stats.likes||{}).forEach(function(k){totalLikes+=A.stats.likes[k]||0;});
  }
  h+='<div class="stat-grid"><div class="stat-card"><b>'+totalViews+'</b><span>Прегледи общо</span></div>'+
    '<div class="stat-card"><b>'+totalLikes+'</b><span>Харесвания общо</span></div></div>';
  h+='<div class="two-col">'+
    '<div><h3>Най-отваряно</h3>'+(A.stats?topStatsHTML("views"):'<p class="a-note">Зарежда…</p>')+'</div>'+
    '<div><h3>Най-харесвано</h3>'+(A.stats?topStatsHTML("likes"):'<p class="a-note">Зарежда…</p>')+'</div>'+
    '</div>';
  h+='<div class="quick-new">'+Object.keys(TYPES).filter(can).map(function(k){
    return '<button class="pbtn" data-act="new" data-k="'+k+'">+ '+esc2(TYPES[k].label)+'</button>';}).join("")+'</div>';
  return h;
}
function loadStats(){
  A.stats=null;
  if(location.protocol==="file:"){ A.stats={views:{},likes:{}}; draw(); return; }
  fetch("/api/stats").then(function(r){return r.ok?r.json():null;})
    .then(function(j){ A.stats=j||{views:{},likes:{}}; draw(); })
    .catch(function(){ A.stats={views:{},likes:{}}; draw(); });
}
function findByStatKey(key){
  var i=key.indexOf(":"); if(i<0) return null;
  var ck=key.slice(0,i), id=key.slice(i+1);
  var kind={r:"reviews",n:"news",c:"craft",e:"episodes",k:"calendar"}[ck];
  if(!kind) return null;
  var it=(all(kind)||[]).filter(function(x){return String(x.id)===id;})[0];
  return it?{kind:kind,it:it}:null;
}
function topStatsHTML(field){
  var obj=(A.stats&&A.stats[field])||{};
  var arr=Object.keys(obj).map(function(k){return {key:k,n:obj[k]||0,f:findByStatKey(k)};})
    .filter(function(x){return x.n>0&&x.f;}); /* прескача изтрити статии — броячът им остава в статистиката, но няма къде да води */
  arr.sort(function(a,b){return b.n-a.n;});
  arr=arr.slice(0,8);
  if(!arr.length) return '<p class="a-note">Още няма данни.</p>';
  var max=arr[0].n;
  return arr.map(function(x){
    return '<div class="rank-row" data-act="edit" data-k="'+x.f.kind+'" data-id="'+esc2(x.f.it.id)+'">'+
      '<span class="rank-bar" style="width:'+Math.max(6,Math.round(x.n/max*100))+'%"></span>'+
      '<span class="rank-t">'+esc2(x.f.it.t)+'</span><span class="rank-kind">'+esc2(TYPES[x.f.kind].label)+'</span>'+
      '<span class="rank-n">'+x.n+'</span></div>';
  }).join("");
}

/* ---------- списък ---------- */
var CAT_FIELD = {news:"cat", reviews:"g", craft:"cat", episodes:"cat"};
function tagLbl(s){ return (D.tagLabels||{})[s]||s; }
function selBar(id,ph,opts){
  return '<select id="'+id+'" class="a-sel">'+
    '<option value="">'+esc2(ph)+'</option>'+
    opts.map(function(o){var v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return '<option value="'+esc2(v)+'">'+esc2(t)+'</option>';}).join("")+
    '</select>';
}
function calTypeKey(it){
  if(it.kind==="event") return "event";
  if(it.kind==="cinema") return "cinema";
  return it.sub ? "series" : "stream-movie";
}
/* платформата на календарен запис в момента активна ли е — изключена платформа спира всичко за нея, докато не се включи пак */
function calPlatformActive(it){
  if(!it.platform) return true;
  var cp=D.settings&&D.settings.calProviders;
  if(!Array.isArray(cp)) return true;
  return cp.some(function(p){return p.name===it.platform;});
}
function sortSelHTML(current){
  var opts=[["upcoming","Предстоящи напред"],["date-desc","Най-нови"],["date-asc","Най-стари"],["title-az","Заглавие А-Я"]];
  return '<select id="fSort" class="a-sel">'+opts.map(function(o){
    return '<option value="'+o[0]+'"'+(current===o[0]?" selected":"")+'>'+esc2(o[1])+'</option>';
  }).join("")+'</select>';
}
/* списъчната страница на календара остава по дизайн както е в момента на сайта — непроменена */
function listTab(k){
  if(k==="calendar") return listTabCalendar();
  var T=TYPES[k], list=all(k).slice().filter(mine);
  list.sort(function(a,b){return String(b.when||"").localeCompare(String(a.when||""));});
  var h='<h2>'+esc2(T.label)+'</h2><p class="a-sub">'+list.length+' материала</p>';
  h+='<div class="p-toolbar"><button class="pbtn pri" data-act="new" data-k="'+k+'">+ Нов</button>'+
    '<input id="fltr" placeholder="търси по заглавие">';
  var catField=CAT_FIELD[k];
  if(catField){
    var cats=[]; list.forEach(function(it){var v=it[catField]; if(v&&cats.indexOf(v)<0)cats.push(v);}); cats.sort();
    h+=selBarNew("fCat","всички категории",cats);
  }
  var tagSet={}; list.forEach(function(it){(it.tags||[]).forEach(function(tg){tagSet[tg]=1;});});
  var tagKeys=Object.keys(tagSet).sort(function(a,b){return tagLbl(a).localeCompare(tagLbl(b));});
  if(tagKeys.length) h+=selBarNew("fTag","всички тагове",tagKeys.map(function(tg){return [tg,tagLbl(tg)];}));
  h+='<span class="psp"></span><span class="pcnt">'+list.length+' материала</span></div>';
  h+='<div id="aList">';
  h+=list.map(function(it){ return listRowNew(k,it); }).join("")||'<p class="a-note">Още няма нищо тук.</p>';
  return h+"</div>";
}
function selBarNew(id,ph,opts){
  return '<select id="'+id+'">'+
    '<option value="">'+esc2(ph)+'</option>'+
    opts.map(function(o){var v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return '<option value="'+esc2(v)+'">'+esc2(t)+'</option>';}).join("")+
    '</select>';
}
function listRowNew(k,it){
  var T=TYPES[k], img = k==="episodes" ? ytThumb(it.yt) : (it[T.img]||"");
  var catField=CAT_FIELD[k];
  var st=it.status||"published";
  var rcls = st==="published"?"published":st==="hidden"?"hidden":st==="review"?"review":"";
  var can2 = canPublish()&&(st==="published"||st==="hidden");
  return '<div class="p-row" style="cursor:default" data-title="'+esc2(String(it.t||"").toLowerCase())+'"'+
    (catField?' data-cat="'+esc2(it[catField]||"")+'"':"")+
    ' data-tags="'+esc2((it.tags||[]).join(","))+'">'+
    (img?'<img class="'+(T.shape==="p"?"p":"")+'" src="'+esc2(img)+'" alt="">':'<img class="'+(T.shape==="p"?"p":"")+'" alt="">')+
    '<div class="pinfo"><div class="pttl">'+esc2(it.t||"(без заглавие)")+'</div>'+
    '<div class="pmeta">'+esc2([it.when,it.authorName].filter(Boolean).join(" · "))+'</div></div>'+
    '<button class="rpill '+rcls+'" style="cursor:'+(can2?"pointer":"default")+'" '+(can2?'data-act="toggle" data-k="'+k+'" data-id="'+it.id+'"':"disabled")+'>'+esc2(STATUS[st]||st)+'</button>'+
    '<button class="pbtn sm" data-act="edit" data-k="'+k+'" data-id="'+it.id+'">Редактирай</button>'+
    (isAdmin()?'<button class="pbtn sm dan" data-act="del" data-k="'+k+'" data-id="'+it.id+'">Изтрий</button>':'')+
    '</div>';
}
function listTabCalendar(){
  var k="calendar", T=TYPES[k], list=all(k).slice().filter(mine);
  list=list.filter(calPlatformActive); /* изключена платформа не се вижда и в админ списъка, докато не се включи пак */
  var sortMode = A.calSort||"upcoming";
  if(sortMode==="upcoming"){
    var td=today();
    list.sort(function(a,b){
      var ap=(a.when||"")>=td?0:1, bp=(b.when||"")>=td?0:1;
      if(ap!==bp) return ap-bp;
      return ap===0 ? String(a.when||"").localeCompare(String(b.when||"")) : String(b.when||"").localeCompare(String(a.when||""));
    });
  }
  else if(sortMode==="date-asc") list.sort(function(a,b){return String(a.when||"").localeCompare(String(b.when||""));});
  else if(sortMode==="title-az") list.sort(function(a,b){return String(a.t||"").localeCompare(String(b.t||""),"bg");});
  else list.sort(function(a,b){return String(b.when||"").localeCompare(String(a.when||""));});
  var h='<h2>'+esc2(T.label)+'</h2><div class="a-bar"><button class="a-btn pri" data-act="new" data-k="'+k+'">+ Нов</button>'+
    (canPublish()?'<button class="a-btn" data-act="calsync">Опресни от TMDB</button>':"")+
    '<input id="fltr" placeholder="търси по заглавие" style="background:#0A0908;border:1px solid var(--line);color:var(--tx);padding:8px 14px;font:inherit">';

  var tagSet={}; list.forEach(function(it){(it.tags||[]).forEach(function(tg){tagSet[tg]=1;});});
  var tagKeys=Object.keys(tagSet).sort(function(a,b){return tagLbl(a).localeCompare(tagLbl(b));});
  if(tagKeys.length) h+=selBar("fTag","всички тагове",tagKeys.map(function(tg){return [tg,tagLbl(tg)];}));

  var plats=[]; list.forEach(function(it){var v=it.platform; if(v&&plats.indexOf(v)<0)plats.push(v);}); plats.sort();
  h+=selBar("fPlat","всички платформи",plats)+
    selBar("fType","всички типове",[["cinema","Филми (по кината)"],["stream-movie","Филми в стрийминг"],["series","Сериали"],["event","Събития"]])+
    sortSelHTML(sortMode);

  h+='<span class="sub" style="color:var(--tx2)">'+list.length+' материала</span></div>';
  if(canPublish()) h+=calProvidersHTML();
  h+='<div id="aList">';
  h+=list.map(function(it){ return listRowAdm(k,it); }).join("")||'<p class="a-note">Още няма нищо тук.</p>';
  return h+"</div>";
}
/* най-гледаните стрийминг платформи в България — ръчно подбран списък, не се тегли автоматично от TMDB */
var DEF_PROVIDERS=[
  {id:8,name:"Netflix"},
  {id:1899,name:"HBO Max"},
  {id:337,name:"Disney Plus"},
  {id:119,name:"Amazon Prime Video"},
  {id:350,name:"Apple TV Plus"},
  {id:1773,name:"SkyShowtime"},
  {id:11,name:"Mubi"}
];
function calProvidersKnown(){
  if(!D.settings.calProvidersKnown||!D.settings.calProvidersKnown.length){
    var active=D.settings.calProviders||[];
    var merged=DEF_PROVIDERS.map(function(p){return {id:p.id,name:p.name,on:true};});
    active.forEach(function(a){
      var ex=merged.filter(function(m){return m.id===a.id;})[0];
      if(ex) ex.on=true; else merged.push({id:a.id,name:a.name,on:true});
    });
    D.settings.calProvidersKnown=merged;
  }
  return D.settings.calProvidersKnown;
}
function calProvidersHTML(){
  var known=calProvidersKnown();
  return '<div class="a-form" style="margin:0 0 16px"><div class="a-f">'+
    '<label>Стрийминг платформи за обновяване от TMDB — предварително избрани най-гледаните в България, кликни да изключиш/включиш</label>'+
    '<div class="tagbox">'+known.map(function(p,i){
      return '<span class="'+(p.on?"on":"")+'" data-act="toggleprovider" data-pidx="'+i+'">'+esc2(p.name)+'</span>';
    }).join("")+'</div>'+
    '<div class="a-grid" style="margin-top:10px">'+
      '<input id="provNewName" placeholder="Име на нова платформа">'+
      '<input id="provNewId" placeholder="Номер в TMDB" type="number">'+
    '</div>'+
    '<button type="button" class="a-btn" data-act="addprovider" style="margin-top:8px">+ Добави платформа</button>'+

function f(label,name,val,type,extra){

function sel(label,name,val,opts){
  return '<div class="a-f"><label>'+esc2(label)+'</label><select data-f="'+name+'">'+
    opts.map(function(o){var v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?(o[1]||o[0]):o;return '<option value="'+esc2(v)+'"'+(String(val)===String(v)?" selected":"")+'>'+esc2(t)+'</option>';}).join("")+
    '</select></div>';
}
function genreArr(v){ return Array.isArray(v)?v:(v?[v]:[]); }
function genreField(name,val){
  var arr=genreArr(val), opts=D.settings.genres||[];
  return '<div class="a-f"><label>Жанр — избери един или повече</label>'+
    '<div class="tagbox">'+opts.map(function(g){
      return '<span data-act="togglegenre" data-gf="'+name+'" data-g="'+esc2(g)+'" class="'+(arr.indexOf(g)>=0?"on":"")+'">'+esc2(g)+'</span>';
    }).join("")+'</div></div>';

function imgField(label,name,val,shape){
  var s=SIZE[shape]||SIZE.h;
  return '<div class="a-f"><label>'+esc2(label)+' — '+s[0]+' × '+s[1]+'</label><div class="a-img">'+
    (val?'<img src="'+esc2(val)+'">':'<p>няма изображение</p>')+
    '<input type="file" accept="image/*" data-img="'+name+'" data-shape="'+shape+'" style="width:auto;background:none;border:0">'+
    (val?'<button class="a-btn dan" data-act="rmimg" data-rmf="'+name+'">Махни</button>':'')+
    '</div><p class="a-note">Смалява се автоматично и се реже от центъра.</p></div>';
}
function titleCaseTag(slug){
  return slug.split("-").map(function(w){return w?w[0].toUpperCase()+w.slice(1):w;}).join(" ");
}
function tagUsageCounts(){
  var counts={};
  ["reviews","news","craft","episodes","calendar"].forEach(function(k){
    (D[k]||[]).forEach(function(it){(it.tags||[]).forEach(function(s){counts[s]=(counts[s]||0)+1;});});
  });
  return counts;
}
/* пълни таговете от реално използваните в съдържанието — не разчита само на tagLabels,
   защото ръчно написан нов таг досега не се регистрираше там (виж и collect()) */
function tagKeysByUsage(){
  var counts=tagUsageCounts(), lab=D.tagLabels||(D.tagLabels={});
  Object.keys(counts).forEach(function(s){ if(!lab[s]) lab[s]=titleCaseTag(s); });
  return Object.keys(lab).sort(function(a,b){
    var d=(counts[b]||0)-(counts[a]||0);
    return d!==0?d:lab[a].localeCompare(lab[b]);
  });
}

function edPreviewHTML(k,it){
  var T=TYPES[k];
  var img = k==="episodes" ? ytThumb(it.yt) : (it[T.img]||"");
  var facts=[];
  if(k==="news") facts=[TYPES.news.label, dt(it.when), it.cat];
  else if(k==="reviews") facts=[TYPES.reviews.label, it.y, genreArr(it.g).join(", "), it.mins?it.mins+" мин":""];
  else if(k==="craft") facts=[TYPES.craft.label, dt(it.when), it.cat, [it.guest,it.role].filter(Boolean).join(", ")];
  else if(k==="episodes") facts=[TYPES.episodes.label, dt(it.when), it.n?"Епизод "+it.n:""];
  else if(k==="merch") facts=[TYPES.merch.label, it.price?it.price+" лв.":"", it.on?"Налично":"Няма наличност"];
  else if(k==="calendar") facts=[dt(it.when), it.time, it.place];
  facts=facts.filter(Boolean);

  var h='<div class="pv-page">';
  h+= img ? '<div class="pv-shot'+(T.shape==="p"?" p":"")+'"><img src="'+esc2(img)+'"></div>' : '<div class="pv-shot'+(T.shape==="p"?" p":"")+'"></div>';

      '<p>'+(it.on?"Налично":"В момента не е налично")+'</p></div>';

function saveUser(){
  var e=A.userEdit||{};
  var body={act:"save",id:e.id||"",name:uVal("name"),email:uVal("email"),role:uVal("role")||"author",password:uVal("pass")};
  if(!body.name.trim()){ flash("Сложи име.","err"); return; }
  if(!e.id&&body.password.length<8){ flash("Паролата трябва да е поне 8 знака.","err"); return; }
  if(location.protocol==="file:"){ flash("Демонстрационен режим — потребителят не се записва.","err"); return; }
  fetch("/api/users",{method:"POST",headers:uHeaders(),body:JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(x){
      if(!x.ok){ flash(x.j.message||"Не стана.","err"); return; }
      A.users=x.j.users||[]; A.userEdit=null;
      flash(body.id?"Записано.":"Добавен е нов човек. Дай му имейла и паролата.","ok");
    }).catch(function(){ flash("Няма връзка със сървъра.","err"); });
}
function delUser(id){
  var u=(A.users||[]).filter(function(x){return x.id===id;})[0];
  if(!confirm("Да изтрия ли "+((u&&u.name)||id)+"?")) return;
  fetch("/api/users",{method:"POST",headers:uHeaders(),body:JSON.stringify({act:"delete",id:id})})
    .then(function(r){ return r.json(); })
    .then(function(j){ A.users=j.users||A.users; flash("Изтрит.","ok"); })
    .catch(function(){ flash("Няма връзка със сървъра.","err"); });
}

/* ---------- събития ---------- */
function onClick(e){
  var t=e.target.closest?e.target.closest("[data-act],[data-tab],[data-md],[data-sec]"):null;
  if(e.target.id==="lgGo"){ doLogin(); return; }
  if(!t) return;
  if(t.hasAttribute("data-sec")){ t.parentElement.classList.toggle("open"); return; }
  var act=t.getAttribute("data-act"), k=t.getAttribute("data-k"), id=t.getAttribute("data-id");
  if(t.hasAttribute("data-tab")){ A.edit=null; A.tab=t.getAttribute("data-tab"); if(A.tab==="users"){A.users=null;A.userEdit=null;A.usersErr=null;} draw(); return; }
  if(t.hasAttribute("data-md")){ insert(t.getAttribute("data-md")); return; }
  if(act==="new"){ A.editKind=k; A.edit=blank(k); A.calMode=undefined; A.edMode="write"; draw(); return; }
  if(act==="edit"){ A.editKind=k; A.edit=JSON.parse(JSON.stringify(all(k).filter(function(x){return x.id===id;})[0]||{})); A.tab=k; A.calMode=undefined; A.edMode="write"; draw();
    if(k==="calendar"||k==="reviews") autoTmdbTags(); return; }
  if(act==="back"){ A.edit=null; A.calMode=undefined; A.edMode="write"; draw(); return; }
  if(act==="save"){ save(); return; }

function collect(){

    var n=el.getAttribute("data-f");
    if(n.indexOf("s:")===0||n.indexOf("nu:")===0) return;

      it.tags=el.value.split(",").map(function(t){
        return t.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
      }).filter(Boolean);
      return;
    }
    if(n==="sizesTxt"){ it.sizes=el.value.split(",").map(function(s){return s.trim();}).filter(Boolean); return; }
    if(n==="on"){ it.on=!!el.value; return; }

function addTagByName(name){
  var slug=String(name||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  if(!slug||!A.edit) return null;
  var lab=D.tagLabels||(D.tagLabels={}); if(!lab[slug]) lab[slug]=name;
  var arr=(A.edit.tags||[]).slice();
  if(arr.indexOf(slug)<0) arr.push(slug);
  A.edit.tags=arr;
  return slug;
}
function tmdbSuggestNames(j){
  var names=j?[].concat(
    j.titleLatin?[j.titleLatin]:[],
    j.cast||[],
    j.director?[j.director]:[],
    j.collection?[j.collection]:[],
    j.genres||[],
    j.companies||[],
    j.keywords||[]
  ):[];
  var seen={}; return names.filter(function(n){ var k=n.toLowerCase(); if(seen[k])return false; seen[k]=1; return true; });
}
/* за Календар и Ревюта — тегли и добавя тагове от TMDB автоматично, без клик, но само докато полето е празно
   (за да не бута обратно тагове, които админ вече е изчистил ръчно при по-предишно отваряне) */
function autoTmdbTags(){
  var it=A.edit; if(!it||!it.t||(it.tags&&it.tags.length)) return;
  var q=String(it.t).trim(); if(!q) return;
  fetch("/api/tmdb-search-tags?q="+encodeURIComponent(q))
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){
      if(A.edit!==it||(it.tags&&it.tags.length)) return;
      var names=tmdbSuggestNames(j);
      if(!names.length) return;

/* ---------- изображения ---------- */
function resize(file,w,h,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var c=document.createElement("canvas"); c.width=w; c.height=h;
      var sc=Math.max(w/im.width,h/im.height), nw=im.width*sc, nh=im.height*sc;
      c.getContext("2d").drawImage(im,(w-nw)/2,(h-nh)/2,nw,nh);
      var out=""; try{ out=c.toDataURL("image/webp",.82); }catch(e){}
      if(!out||out.indexOf("data:image/webp")!==0) out=c.toDataURL("image/jpeg",.82);
      cb(out, Math.round(out.length*.75/1024));
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function readImage(el){

    else if(A.edit) A.edit[name]=uri;
    flash("Снимката е смалена до "+s[0]+"×"+s[1]+" · "+kb+" KB","ok");
    draw();
  });
}

function save(){
  collectSettings();
  if(!A.edit){ persist("Записано."); return; }
  collect();
  var k=A.editKind, it=A.edit;
  /* регистрирай нови тагове в общия речник само тук, при явен запис —
     не при всяко натискане на клавиш, за да не се хващат недовършени думи */
  var tagsTxtEl=document.querySelector('[data-f="tagsTxt"]');
  if(tagsTxtEl){
    var lab=D.tagLabels||(D.tagLabels={});
    tagsTxtEl.value.split(",").forEach(function(t){
      var raw=t.trim(); if(!raw) return;
      var s=raw.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
      if(s&&!lab[s]) lab[s]=raw;
    });
  }
  if(!it.t.trim()){ flash("Трябва заглавие.","err"); return; }
  if(!canPublish()) it.status = it.status==="draft" ? "draft" : "review";
  if(!it.authorName&&A.me) it.authorName=A.me.name;
  var list=all(k), i=-1;
  list.forEach(function(x,n){ if(x.id===it.id) i=n; });

function dlJson(obj){

  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);

function readBackup(el){

      A.backup=n; A.tab="backup"; flash("Копието е отворено. Избери какво да върнеш.","ok");
    }catch(e){ flash("Файлът не се чете: "+e.message,"err"); }
