<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Панел — Men In A Movie</title>
<meta name="theme-color" content="#F6C92B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&family=Oswald:wght@400;500;600&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--y:#F6C92B;--bg:#0A0908;--card:#141210;--card2:#1C1916;--tx:#F2F0EB;--tx2:#A6A196;--line:#2A2723;--black:#1A1600}
*{box-sizing:border-box;border-radius:0!important}
html,body{margin:0;padding:0;background:#0D0C0A}
body{color:var(--tx);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.7}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.logo{font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;letter-spacing:-.03em;text-transform:uppercase}
.prose{font-size:16px;line-height:1.75}
.prose h2{font-family:Oswald,sans-serif;font-weight:600;font-size:20px;margin:1.4em 0 .4em}
.prose blockquote{border-left:4px solid var(--y);margin:1.2em 0;padding-left:14px;color:var(--tx2)}
.prose a{color:var(--y)}
.prose figure{margin:1.4em 0}
.prose figcaption{font-size:13px;color:var(--tx2);margin-top:5px}
.answer{border-left:4px solid var(--y);padding-left:14px;margin:0 0 18px;font-size:17px}
/* ================= АДМИН ПАНЕЛ V2 ================= */
#adm{position:fixed;inset:0;z-index:900;background:#0D0C0A;color:var(--tx);display:none;overflow:auto;font-size:15px}
#adm.on{display:block}
#adm *{border-radius:0!important}
.a-top{position:sticky;top:0;z-index:5;background:var(--y);color:var(--black);display:flex;align-items:center;gap:14px;padding:10px 16px}
.a-top .logo{font-size:17px}
.a-top .sp{flex:1}
.a-who{font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.07em;text-transform:uppercase}
.a-save{font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border:1px solid rgba(0,0,0,.3)}
.a-wrap{display:flex;min-height:calc(100vh - 46px)}
.a-side{flex:0 0 210px;background:#131210;border-right:1px solid var(--line);padding:14px 0}
.a-side a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 16px;font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);cursor:pointer}
.a-side a:hover{background:#1C1916;color:var(--tx)}
.a-side a.on{background:var(--y);color:var(--black)}
.a-side .dot{width:7px;height:7px;background:var(--y);display:inline-block}
.a-main{flex:1;min-width:0;padding:20px 22px 60px}
.a-main h2{font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;font-size:22px;color:var(--y);margin:0 0 14px}
.a-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.a-btn{background:none;border:1px solid var(--line);color:var(--tx);font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:8px 14px;cursor:pointer}
.a-btn:hover{border-color:var(--y);color:var(--y)}
.a-btn.pri{background:var(--y);border-color:var(--y);color:var(--black)}
.a-btn.dan{border-color:#7a2320;color:#e07a76}
.a-row{display:flex;align-items:center;gap:12px;background:#161412;border:1px solid var(--line);padding:9px 12px;margin-bottom:6px}
.a-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-row .sub{color:var(--tx2);font-size:12px;white-space:nowrap}
.a-row img{width:64px;height:36px;object-fit:cover;background:#0A0908}
.a-row img.p{width:26px;height:39px}
.st{font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);color:var(--tx2);cursor:default;background:none}
.st.pub{background:var(--y);color:var(--black);border-color:var(--y);cursor:pointer}
.st.hid{background:#7a2320;color:#fff;border-color:#7a2320;cursor:pointer}
.st.rev{background:#2b2a12;color:var(--y);border-color:#5a5320}
.a-form{display:grid;gap:14px;max-width:900px}
.a-f label{display:block;font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2);margin-bottom:5px}
.a-f input,.a-f select,.a-f textarea{width:100%;background:#0A0908;border:1px solid var(--line);color:var(--tx);font:inherit;font-size:15px;padding:9px 11px}
.a-f textarea{min-height:220px;line-height:1.6;resize:vertical;font-family:Manrope,sans-serif}
.a-f input:focus,.a-f textarea:focus,.a-f select:focus{outline:0;border-color:var(--y)}
.a-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.a-note{color:var(--tx2);font-size:12px;margin-top:5px}
.a-warn{color:#e0b34a;font-size:12px;margin-top:5px}
.a-img{border:1px dashed var(--line);padding:10px;text-align:center;color:var(--tx2);font-size:13px}
.a-img img{max-height:170px;margin:0 auto 8px;object-fit:contain}
.tagbox{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tagbox span{border:1px solid var(--line);color:var(--y);font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;cursor:pointer}
.tagbox span:hover{border-color:var(--y)}
.a-tools{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.a-tools button{background:#161412;border:1px solid var(--line);color:var(--tx2);font-size:12px;padding:5px 9px;cursor:pointer;font-family:Oswald,sans-serif;letter-spacing:.05em}
.a-tools button:hover{color:var(--y);border-color:var(--y)}
.a-prev{border:1px solid var(--line);padding:14px;background:#0A0908;max-height:340px;overflow:auto}
.a-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.a-stat{background:#161412;border:1px solid var(--line);padding:12px 14px}
.a-stat b{display:block;font-family:Oswald,sans-serif;font-size:26px;color:var(--y);font-weight:500}
.a-pending{border:2px solid var(--y);padding:12px 14px;margin-bottom:18px}
.a-pending h3{margin:0 0 8px;font-family:Oswald,sans-serif;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--y)}
.a-login{max-width:360px;margin:14vh auto;background:#131210;border:1px solid var(--line);padding:24px}
.a-login h2{font-size:20px}
.a-msg{padding:8px 12px;border:1px solid var(--line);color:var(--tx2);font-size:13px;margin-bottom:12px}
.a-msg.ok{border-color:#2f5c2b;color:#9ed08f}
.a-msg.err{border-color:#7a2320;color:#e07a76}
@media(max-width:800px){.a-wrap{flex-direction:column}.a-side{flex:none;display:flex;overflow-x:auto}.a-side a{white-space:nowrap}.a-cols{grid-template-columns:1fr}}

</style>
</head>
<body>
<script>
"use strict";
/* ---------- помощни, същите като на сайта ---------- */
var D = {settings:{},heads:{},tagLabels:{},reviews:[],news:[],craft:[],episodes:[],merch:[],calendar:[]};
var MON=["януари","февруари","март","април","май","юни","юли","август","септември","октомври","ноември","декември"];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function dt(s){if(!s)return"";var p=String(s).slice(0,10).split("-");if(p.length<3)return s;return (+p[2])+" "+MON[+p[1]-1]+" "+p[0];}
function slugify(s){
  var m={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sht","ъ":"a","ь":"","ю":"yu","я":"ya"};
  return String(s||"").toLowerCase().split("").map(function(c){return m[c]!==undefined?m[c]:c;}).join("")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60);
}
function ytId(u){var m=/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{6,})/.exec(u||"");return m?m[1]:"";}
function ytThumb(u){var i=ytId(u);return i?"https://i.ytimg.com/vi/"+i+"/hqdefault.jpg":"";}
function txt(s){return String(s||"").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();}
function md(s){
  return String(s||"").split(/\n{2,}/).map(function(b){
    b=b.trim(); if(!b) return "";
    var img=/^!\[([^\]]*)\]\(([^)]+)\)$/.exec(b);
    if(img) return '<figure><img src="'+esc(img[2])+'" alt="'+esc(img[1])+'">'+(img[1]?'<figcaption>'+esc(img[1])+'</figcaption>':'')+'</figure>';
    if(/^##\s+/.test(b)) return "<h2>"+inl(b.replace(/^##\s+/,""))+"</h2>";
    if(/^>\s+/.test(b)) return "<blockquote>"+inl(b.replace(/^>\s+/gm,""))+"</blockquote>";
    if(/^[-•]\s+/m.test(b)) return "<ul>"+b.split(/\n/).map(function(l){return "<li>"+inl(l.replace(/^[-•]\s+/,""))+"</li>";}).join("")+"</ul>";
    return "<p>"+inl(b).replace(/\n/g,"<br>")+"</p>";
  }).join("");
  function inl(t){
    return esc(t)
      .replace(/!\[([^\]]*)\]\((\/[^)\s]+|https?:\/\/[^)\s]+)\)/g,'<img src="$2" alt="$1">')
      .replace(/\[([^\]]+)\]\((\/[^)\s]+|https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g,"<em>$1</em>");
  }
}
/* V1 → V2, за да се отваря и старо резервно копие */
function normalize(raw){
  if(!raw||!raw.reviews) return null;
  if(raw.tagLabels) return raw;
  var lab={};
  function tg(a){return (a||[]).map(function(t){var s=String(t).trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");if(!s)return null;lab[s]=lab[s]||String(t).trim();return s;}).filter(Boolean);}
  var o={settings:raw.settings||{},heads:raw.heads||{},tagLabels:lab,
    reviews:(raw.reviews||[]).map(function(r){return{id:r.id,t:r.t,when:r.when||"",y:r.y,g:r.g,s:+r.s||0,mins:r.mins,poster:r.poster||"",share:"",video:r.video||"",lead:r.verdict||"",body:r.body||"",tags:tg(r.tags),status:r.status||"published",authorName:r.authorName||""};}),
    news:(raw.news||[]).map(function(n){return{id:n.id,t:n.t,when:n.when||"",cat:n.tag||"",img:n.img||"",video:n.video||"",lead:n.p||"",body:n.body||"",tags:tg(n.tags),status:n.status||"published",authorName:n.authorName||"",source:"",sourceUrl:""};}),
    craft:(raw.craft||[]).map(function(c){return{id:c.id,t:c.t,when:c.when||"",cat:c.tag||"",img:c.img||"",video:c.video||"",guest:c.guest||"",role:c.role||"",lead:c.p||"",body:c.body||"",tags:tg(c.tags),status:c.status||"published",authorName:c.authorName||""};}),
    episodes:(raw.episodes||[]).map(function(e){return{id:e.id,n:e.n,t:e.t,when:e.d||e.when||"",cat:e.tag||"",lead:e.desc||e.lead||"",body:"",yt:e.yt||"",sp:e.sp||"",len:e.len,tags:tg(e.tags),status:"published",authorName:""};}),
    merch:(raw.merch||[]).map(function(m){return{id:m.id,t:m.t,lead:m.d||m.lead||"",body:"",price:+m.p||0,sizes:m.sizes||[],img:m.img||"",on:!!m.on,tags:[],status:"published"};}),
    calendar:(raw.calendar||[]).filter(function(c){return !c.hidden;})};
  o.calendar.forEach(function(c){c.tags=tg(c.tags);});
  return o;
}
function route(){}
</script>
<script>
/* ================= АДМИН ПАНЕЛ V2 ================= */
(function(){
"use strict";

var A = { open:false, me:null, tab:"dash", edit:null, editKind:null, backup:null, msg:null, dirty:false, users:null, userEdit:null, usersErr:null };

var TYPES = {
  news:     {label:"Новини",     path:"novina",    img:"img",    shape:"h", roles:["admin","moderator","author"]},
  reviews:  {label:"Ревюта",     path:"revyu",     img:"poster", shape:"p", roles:["admin","moderator","author"]},
  craft:    {label:"Зад кадър",  path:"zad-kadar", img:"img",    shape:"h", roles:["admin","moderator","author"]},
  episodes: {label:"Подкаст",    path:"epizod",    img:"",       shape:"h", roles:["admin","moderator"]},
  merch:    {label:"Мърч",       path:"produkt",   img:"img",    shape:"h", roles:["admin"]},
  calendar: {label:"Календар",   path:"kalendar",  img:"poster", shape:"p", roles:["admin","moderator"]}
};
var STATUS = {draft:"Чернова", review:"За одобрение", published:"Публикувано", hidden:"Скрито"};
var SIZE = {h:[1200,675], p:[600,900], b:[1200,300]};

function can(k){ return A.me && TYPES[k] && TYPES[k].roles.indexOf(A.me.role)>=0; }
function isAdmin(){ return A.me && A.me.role==="admin"; }
function canPublish(){ return A.me && (A.me.role==="admin"||A.me.role==="moderator"); }
function mine(it){ return !A.me || A.me.role!=="author" || !it.authorName || it.authorName===A.me.name; }
function esc2(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function uid(p){ return p+"-"+Math.random().toString(36).slice(2,8); }
function today(){ return new Date().toISOString().slice(0,10); }

/* ---------- отваряне ---------- */
function openAdmin(){
  if(!document.getElementById("adm")) build();
  A.open=true; document.getElementById("adm").classList.add("on");
  if(!A.me) loginScreen(); else draw();
}
function build(){
  var d=document.createElement("div"); d.id="adm";
  d.innerHTML='<div class="a-top"><span class="logo">MIM · панел</span><span class="sp"></span>'+
    '<span class="a-who" id="aWho"></span><span class="a-save" id="aSave"></span>'+
    '<a class="a-btn" href="/" style="text-decoration:none">← Към сайта</a></div><div id="aBody"></div>';
  document.body.appendChild(d);
  d.addEventListener("click",onClick);
  d.addEventListener("change",onChange);
  d.addEventListener("input",onInput);
}

/* ---------- вход ---------- */
function loginScreen(msg){
  document.getElementById("aBody").innerHTML=
    '<div class="a-login"><h2>Вход в панела</h2>'+
    (msg?'<div class="a-msg err">'+esc2(msg)+'</div>':'')+
    '<div class="a-f" style="margin-bottom:12px"><label>Имейл</label><input id="lgEmail" type="email" autocomplete="username"></div>'+
    '<div class="a-f" style="margin-bottom:14px"><label>Парола</label><input id="lgPass" type="password" autocomplete="current-password"></div>'+
    '<button class="a-btn pri" id="lgGo" style="width:100%">Влез</button>'+
    '<p class="a-note">Празен имейл + резервният ключ също влиза, както досега.</p></div>';
  document.getElementById("aWho").textContent="";
}
function doLogin(){
  var email=(document.getElementById("lgEmail")||{}).value||"";
  var pass=(document.getElementById("lgPass")||{}).value||"";
  if(location.protocol==="file:"){
    A.me={name:"Демо администратор",role:"admin",email:email||"demo"};
    flash("Няма сървър — панелът работи в демонстрационен режим. Промените не се записват."); draw(); return;
  }
  fetch("/api/login",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify(email?{email:email,password:pass}:{key:pass})})
  .then(function(r){return r.ok?r.json():null;})
  .then(function(u){
    if(!u){ loginScreen("Не влиза. Провери имейла и паролата."); return; }
    A.me={name:u.name||"Администратор",role:u.role||"admin",email:u.email||email,token:u.token};
    if(u.token) try{ sessionStorage.setItem("mim-token",u.token); }catch(e){}
    draw();
  }).catch(function(){ loginScreen("Сървърът не отговаря."); });
}

/* ---------- рамка ---------- */
function draw(){
  document.getElementById("aWho").textContent=A.me.name+" · "+({admin:"администратор",moderator:"модератор",author:"автор"}[A.me.role]||A.me.role);
  var tabs=[["dash","Табло"]];
  Object.keys(TYPES).forEach(function(k){ if(can(k)) tabs.push([k,TYPES[k].label]); });
  tabs.push(["backup","Резервно копие"]);
  if(isAdmin()){ tabs.push(["heads","Рубрики"]); tabs.push(["settings","Настройки"]); tabs.push(["users","Потребители"]); }
  var side=tabs.map(function(t){
    var n=t[0]!=="dash"&&TYPES[t[0]]?pending(t[0]).length:0;
    return '<a data-tab="'+t[0]+'" class="'+(A.tab===t[0]?"on":"")+'">'+esc2(t[1])+(n?'<span class="dot"></span>':'')+'</a>';
  }).join("");
  document.getElementById("aBody").innerHTML='<div class="a-wrap"><div class="a-side">'+side+'</div><div class="a-main" id="aMain"></div></div>';
  var m=document.getElementById("aMain");
  var body="";
  if(A.msg) body+='<div class="a-msg '+(A.msg.k||"")+'">'+esc2(A.msg.t)+'</div>';
  if(A.edit) body+=editor();
  else if(A.tab==="dash") body+=dash();
  else if(A.tab==="backup") body+=backupTab();
  else if(A.tab==="heads") body+=headsTab();
  else if(A.tab==="settings") body+=settingsTab();
  else if(A.tab==="users") body+=usersTab();
  else body+=listTab(A.tab);
  m.innerHTML=body;
}
function flash(t,k){ A.msg={t:t,k:k||""}; if(A.open&&A.me) draw(); setTimeout(function(){ if(A.msg&&A.msg.t===t){A.msg=null; if(A.open&&A.me)draw();} },6000); }

function all(k){ return D[k]||(D[k]=[]); }
function pending(k){ return all(k).filter(function(i){return i.status==="review";}); }

/* ---------- табло ---------- */
function dash(){
  var h="";
  if(canPublish()){
    var p=[]; Object.keys(TYPES).forEach(function(k){ pending(k).forEach(function(i){ p.push({k:k,i:i}); }); });
    if(p.length) h+='<div class="a-pending"><h3>'+p.length+' чакат одобрение</h3>'+p.map(function(x){
      return '<div class="a-row"><span class="sub">'+esc2(TYPES[x.k].label)+'</span><span class="t">'+esc2(x.i.t)+'</span>'+
        '<span class="sub">'+esc2(x.i.authorName||"")+' '+esc2(x.i.when||"")+'</span>'+
        '<button class="a-btn" data-act="edit" data-k="'+x.k+'" data-id="'+x.i.id+'">Прегледай</button>'+
        '<button class="a-btn pri" data-act="approve" data-k="'+x.k+'" data-id="'+x.i.id+'">Одобри</button></div>';
    }).join("")+'</div>';
  }
  h+='<h2>Табло</h2><div class="a-grid">'+Object.keys(TYPES).filter(can).map(function(k){
    return '<div class="a-stat"><b>'+all(k).length+'</b>'+esc2(TYPES[k].label)+'</div>';
  }).join("")+'<div class="a-stat"><b>'+Object.keys(D.tagLabels||{}).length+'</b>Тагове</div></div>';
  h+='<div class="a-bar" style="margin-top:18px">'+Object.keys(TYPES).filter(can).map(function(k){
    return '<button class="a-btn" data-act="new" data-k="'+k+'">+ '+esc2(TYPES[k].label)+'</button>';}).join("")+'</div>';
  return h;
}

/* ---------- списък ---------- */
function listTab(k){
  var T=TYPES[k], list=all(k).slice().filter(mine);
  list.sort(function(a,b){return String(b.when||"").localeCompare(String(a.when||""));});
  var h='<h2>'+esc2(T.label)+'</h2><div class="a-bar"><button class="a-btn pri" data-act="new" data-k="'+k+'">+ Нов</button>'+
    '<input id="fltr" placeholder="търси по заглавие" style="background:#0A0908;border:1px solid var(--line);color:var(--tx);padding:7px 10px;font:inherit">'+
    '<span class="sub" style="color:var(--tx2)">'+list.length+' материала</span></div><div id="aList">';
  h+=list.map(function(it){ return listRowAdm(k,it); }).join("")||'<p class="a-note">Още няма нищо тук.</p>';
  return h+"</div>";
}
function listRowAdm(k,it){
  var T=TYPES[k], img = k==="episodes" ? ytThumb(it.yt) : (it[T.img]||"");
  var st=it.status||"published", cls = st==="published"?"pub":st==="hidden"?"hid":st==="review"?"rev":"";
  var can2 = canPublish()&&(st==="published"||st==="hidden");
  return '<div class="a-row" data-title="'+esc2(String(it.t||"").toLowerCase())+'">'+
    (img?'<img class="'+(T.shape==="p"?"p":"")+'" src="'+esc2(img)+'" alt="">':'<img class="'+(T.shape==="p"?"p":"")+'" alt="">')+

function uHeaders(){
  var hd={"content-type":"application/json"}, tk=null;
  try{ tk=sessionStorage.getItem("mim-token"); }catch(e){}
  if(tk) hd["x-mim-token"]=tk;

}
function loadUsers(){
  if(location.protocol==="file:"){ A.users=[{id:"owner",name:"Демо",email:"demo@local",role:"admin"}]; draw(); return; }
  A.users=[];
  fetch("/api/users",{headers:uHeaders()}).then(function(r){
    if(r.status===403){ A.usersErr="Само администратор вижда хората."; return {users:[]}; }
    return r.ok?r.json():{users:[]};
  }).then(function(j){ A.users=j.users||[]; A.usersErr=A.usersErr||null; draw(); })
   .catch(function(){ A.usersErr="Сървърът не отговаря."; draw(); });
}
function uVal(n){ var e=document.querySelector('[data-u="'+n+'"]'); return e?e.value:""; }
function saveUser(){
  var e=A.userEdit||{};
  var body={act:"save",id:e.id||"",name:uVal("name"),email:uVal("email"),role:uVal("role")||"author",password:uVal("pass")};
  if(!body.name.trim()){ flash("Сложи име.","err"); return; }
  if(!e.id&&body.password.length<8){ flash("Паролата трябва да е поне 8 знака.","err"); return; }
  if(location.protocol==="file:"){ flash("Демонстрационен режим — потребителят не се записва.","err"); return; }
  fetch("/api/users",{method:"POST",headers:uHeaders(),body:JSON.stringify(body)})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(x){
      if(!x.ok){ flash(x.j.message||"Не стана.","err"); return; }
      A.users=x.j.users||[]; A.userEdit=null;
      flash(body.id?"Записано.":"Добавен е нов човек. Дай му имейла и паролата.","ok");
    }).catch(function(){ flash("Няма връзка със сървъра.","err"); });
}
function delUser(id){
  var u=(A.users||[]).filter(function(x){return x.id===id;})[0];
  if(!confirm("Да изтрия ли "+((u&&u.name)||id)+"?")) return;
  fetch("/api/users",{method:"POST",headers:uHeaders(),body:JSON.stringify({act:"delete",id:id})})
    .then(function(r){ return r.json(); })
    .then(function(j){ A.users=j.users||A.users; flash("Изтрит.","ok"); })
    .catch(function(){ flash("Няма връзка със сървъра.","err"); });
}

  if(!t) return;
  var act=t.getAttribute("data-act"), k=t.getAttribute("data-k"), id=t.getAttribute("data-id");
  if(t.hasAttribute("data-tab")){ A.edit=null; A.tab=t.getAttribute("data-tab"); if(A.tab==="users"){A.users=null;A.userEdit=null;A.usersErr=null;} draw(); return; }
  if(t.hasAttribute("data-md")){ insert(t.getAttribute("data-md")); return; }
  if(act==="new"){ A.editKind=k; A.edit=blank(k); draw(); return; }
  if(act==="edit"){ A.editKind=k; A.edit=JSON.parse(JSON.stringify(all(k).filter(function(x){return x.id===id;})[0]||{})); A.tab=k; draw(); return; }
  if(act==="back"){ A.edit=null; draw(); return; }
  if(act==="save"){ save(); return; }
  if(act==="publish"){ A.edit.status="published"; save(); return; }
  if(act==="approve"){ var o=all(k).filter(function(x){return x.id===id;})[0]; if(o){o.status="published"; persist("Одобрено и публикувано.");} return; }
  if(act==="toggle"){ var o2=all(k).filter(function(x){return x.id===id;})[0];
    if(o2){ o2.status = o2.status==="hidden"?"published":"hidden"; persist(o2.status==="hidden"?"Скрито от сайта.":"Върнато на сайта."); } return; }
  if(act==="del"){ if(!confirm("Да изтрия ли „"+(all(k).filter(function(x){return x.id===id;})[0]||{}).t+"“?")) return;
    D[k]=all(k).filter(function(x){return x.id!==id;}); persist("Изтрито."); return; }
  if(act==="rmimg"){ A.edit[t.getAttribute("data-f")]=""; draw(); return; }
  if(act==="addtag"){ var inp=document.querySelector('[data-f="tagsTxt"]'); if(!inp)return;
    var arr=inp.value.split(",").map(function(s){return s.trim();}).filter(Boolean);
    var tg=t.getAttribute("data-tag"); if(arr.indexOf(tg)<0)arr.push(tg);
    inp.value=arr.join(", "); A.edit.tags=arr; checkTags(); return; }
  if(act==="inimg"){ pickInlineImage(); return; }
  if(act==="dl"){ download(); return; }
  if(act==="closebk"){ A.backup=null; draw(); return; }
  if(act==="bkview"){ bkView(k,id); return; }
  if(act==="bkrestore"){ restoreOne(k,id); return; }
  if(act==="restoreall"){ if(confirm("Да върна ли всичко от копието? Заменя цялото съдържание."))
    { ["reviews","news","craft","episodes","merch","calendar","settings","heads","tagLabels"].forEach(function(x){ if(A.backup[x]) D[x]=A.backup[x]; });
      persist("Върнато от копието."); } return; }
  if(act==="uedit"){ A.userEdit=(A.users||[]).filter(function(x){return x.id===t.getAttribute("data-i");})[0]||null; draw(); return; }
  if(act==="ucancel"){ A.userEdit=null; draw(); return; }
  if(act==="usave"){ saveUser(); return; }
  if(act==="udel"){ delUser(t.getAttribute("data-i")); return; }
  if(act==="adduser"){ var nu={id:uid("u"),name:val("nu:name"),email:val("nu:email"),role:val("nu:role")||"author"};
    if(!nu.name){alert("Трябва име.");return;} (D.settings.users=D.settings.users||[]).push(nu); persist("Добавен потребител."); return; }
  if(act==="deluser"){ D.settings.users.splice(+t.getAttribute("data-i"),1); persist("Изтрит потребител."); return; }
}
function val(n){ var e=document.querySelector('[data-f="'+n+'"]'); return e?e.value:""; }
function onInput(e){
  var el=e.target;
  if(el.hasAttribute&&el.hasAttribute("data-f")&&A.edit){ collect(); if(el.getAttribute("data-f")==="body"||el.getAttribute("data-f")==="lead") preview();
    if(el.getAttribute("data-f")==="tagsTxt") checkTags(); }
  if(el.id==="fltr"){ var q=el.value.toLowerCase();
    [].forEach.call(document.querySelectorAll("#aList .a-row"),function(r){
      r.style.display = (r.getAttribute("data-title")||"").indexOf(q)>=0 ? "" : "none"; }); }
}
function onChange(e){
  var el=e.target;
  if(el.hasAttribute&&el.hasAttribute("data-img")){ readImage(el); return; }
  if(el.hasAttribute&&el.hasAttribute("data-restore")){ readBackup(el); return; }
  if(el.hasAttribute&&el.hasAttribute("data-head")){ var s=el.getAttribute("data-head");
    D.heads[s]=D.heads[s]||{}; D.heads[s][el.getAttribute("data-hf")]=el.value; return; }
  if(el.hasAttribute&&el.hasAttribute("data-f")&&A.edit) collect();
}
function collect(){
  var it=A.edit; if(!it) return;
  [].forEach.call(document.querySelectorAll("#aMain [data-f]"),function(el){
    var n=el.getAttribute("data-f");
    if(n.indexOf("s:")===0||n.indexOf("nu:")===0) return;
    if(n==="tagsTxt"){ it.tags=el.value.split(",").map(function(s){return s.trim().toLowerCase();}).filter(Boolean); return; }
    if(n==="sizesTxt"){ it.sizes=el.value.split(",").map(function(s){return s.trim();}).filter(Boolean); return; }
    if(n==="on"){ it.on=!!el.value; return; }
    if(n==="s"){ it.s=+el.value||0; return; }
    if(n==="price"){ it.price=+el.value||0; return; }
    it[n]=el.value;
  });
}
function checkTags(){
  var w=document.getElementById("tagWarn"); if(!w) return;
  var bad=(A.edit.tags||[]).filter(function(s){return /[а-я]/i.test(s);});
  var neu=(A.edit.tags||[]).filter(function(s){return !(D.tagLabels||{})[s];});
  var m=[];
  if(bad.length) m.push("Тагове на кирилица: "+bad.join(", ")+" — прехвърли ги на латиница, иначе се получават две теми за едно нещо.");
  if(neu.length) m.push("Нови тагове: "+neu.join(", ")+".");
  w.textContent=m.join(" ");
}
function insert(s){
  var ta=document.querySelector('[data-f="body"]'); if(!ta) return;
  var a=ta.selectionStart,b=ta.selectionEnd,v=ta.value,sl=v.slice(a,b);
  var out = s==="**"||s==="*" ? s+(sl||"текст")+s : s==="[" ? "["+(sl||"текст")+"](https://)" : s+(sl||"");
  ta.value=v.slice(0,a)+out+v.slice(b); ta.focus(); ta.selectionStart=ta.selectionEnd=a+out.length;
  collect(); preview();
}

/* ---------- изображения ---------- */
function resize(file,w,h,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var c=document.createElement("canvas"); c.width=w; c.height=h;
      var sc=Math.max(w/im.width,h/im.height), nw=im.width*sc, nh=im.height*sc;
      c.getContext("2d").drawImage(im,(w-nw)/2,(h-nh)/2,nw,nh);
      var out=""; try{ out=c.toDataURL("image/webp",.82); }catch(e){}
      if(!out||out.indexOf("data:image/webp")!==0) out=c.toDataURL("image/jpeg",.82);
      cb(out, Math.round(out.length*.75/1024));
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function readImage(el){
  var file=el.files&&el.files[0]; if(!file) return;
  var name=el.getAttribute("data-img"), sh=el.getAttribute("data-shape")||"h", s=SIZE[sh];
  resize(file,s[0],s[1],function(uri,kb){
    if(name.indexOf("banner:")===0){ var r=name.split(":")[1]; D.heads[r]=D.heads[r]||{}; D.heads[r].banner=uri; }
    else if(A.edit) A.edit[name]=uri;
    flash("Снимката е смалена до "+s[0]+"×"+s[1]+" · "+kb+" KB","ok");
    draw();
  });
}
function pickInlineImage(){
  var i=document.createElement("input"); i.type="file"; i.accept="image/*";
  i.onchange=function(){ var file=i.files[0]; if(!file) return;
    resize(file,1200,675,function(uri){
      var cap=prompt("Подпис под изображението (може празно):")||"";
      insert("\n\n!["+cap+"]("+uri+")\n\n");
    });
  };
  i.click();
}

/* ---------- запис ---------- */
function blank(k){
  var b={id:uid(k.slice(0,1)==="e"&&k==="episodes"?"e":k.slice(0,1)),t:"",when:today(),lead:"",body:"",tags:[],
    status:canPublish()?"published":"review",authorName:A.me?A.me.name:""};
  if(k==="reviews"){b.y="";b.g="";b.s=4;b.mins="";b.poster="";b.share="";b.video="";}
  if(k==="news"){b.img="";b.cat="";b.video="";b.source="";b.sourceUrl="";}
  if(k==="craft"){b.img="";b.cat="";b.video="";b.guest="";b.role="";}
  if(k==="episodes"){b.yt="";b.sp="";b.n="";b.len="";b.cat="";}
  if(k==="merch"){b.img="";b.price=0;b.sizes=[];b.on=true;}
  if(k==="calendar"){b.kind="cinema";b.platform="";b.poster="";b.src="manual";}
  return b;
}
function save(){
  collect();
  var k=A.editKind, it=A.edit;
  if(!it.t.trim()){ flash("Трябва заглавие.","err"); return; }
  if(!canPublish()) it.status = it.status==="draft" ? "draft" : "review";
  if(!it.authorName&&A.me) it.authorName=A.me.name;
  var list=all(k), i=-1;
  list.forEach(function(x,n){ if(x.id===it.id) i=n; });
  if(i<0) list.unshift(it); else list[i]=it;
  A.edit=null;
  persist(canPublish()?"Записано.":"Записано за одобрение.");
}
function persist(msg){
  try{ localStorage.setItem("mim-v2-draft",JSON.stringify({at:Date.now()})); }catch(e){}
  if(location.protocol==="file:"){ flash((msg||"Записано.")+" (демонстрационен режим — не се пази)","ok"); route(); return; }
  var hd={"content-type":"application/json"};
  var tk=null; try{ tk=sessionStorage.getItem("mim-token"); }catch(e){}
  if(tk) hd["x-mim-token"]=tk;
  document.getElementById("aSave").textContent="Записва…";
  fetch("/api/content",{method:"POST",headers:hd,body:JSON.stringify(D)})
    .then(function(r){
      document.getElementById("aSave").textContent = r.ok?"Записано на сайта ✓":"Не се записа";
      flash(r.ok?(msg||"Записано."):"Сървърът отказа записа.", r.ok?"ok":"err");
      route();
    }).catch(function(){ document.getElementById("aSave").textContent="Няма връзка";
      flash("Няма връзка със сървъра. Промяната стои само в този браузър.","err"); route(); });
}
function download(){
  if(location.protocol!=="file:"){
    flash("Събира копието със снимките…");
    var hd={}; var tk=null; try{ tk=sessionStorage.getItem("mim-token"); }catch(e){}
    if(tk) hd["x-mim-token"]=tk;
    fetch("/api/content?full=1",{headers:hd}).then(function(r){return r.ok?r.json():null;})
      .then(function(full){ dlJson(full||D); })
      .catch(function(){ dlJson(D); });
    return;
  }
  dlJson(D);
}
function dlJson(obj){
  var name="mim-backup-"+today()+".json";
  var blob=new Blob([JSON.stringify(obj)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
  flash("Свалено: "+name+" — със снимките вътре","ok");
}
function readBackup(el){
  var file=el.files&&el.files[0]; if(!file) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var raw=JSON.parse(fr.result);
      var n=raw.tagLabels?raw:normalize(raw);
      if(!n){ flash("Този файл не прилича на резервно копие.","err"); return; }
      A.backup=n; A.tab="backup"; flash("Копието е отворено. Избери какво да върнеш.","ok");
    }catch(e){ flash("Файлът не се чете: "+e.message,"err"); }
  };
  fr.readAsText(file);
}
function restoreOne(k,id){
  var it=(A.backup[k]||[]).filter(function(x){return x.id===id;})[0]; if(!it) return;
  var list=all(k), i=-1; list.forEach(function(x,n){ if(x.id===id) i=n; });
  if(i<0) list.unshift(JSON.parse(JSON.stringify(it))); else list[i]=JSON.parse(JSON.stringify(it));
  persist("Върнато от копието: „"+it.t+"“");
}

window.MIMAdmin={open:openAdmin,refresh:function(){ if(A.me) draw(); }};
})();

</script>
<script>
/* ---------- зареждане на съдържанието ---------- */
(function(){
  if(location.protocol==="file:"){ MIMAdmin.open(); return; }
  fetch("/api/content").then(function(r){return r.ok?r.json():null;}).then(function(raw){
    var n=raw&&(raw.tagLabels?raw:normalize(raw));
    if(n) D=n;
  }).catch(function(){}).then(function(){ MIMAdmin.open(); });
})();
</script>
