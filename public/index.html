<style>
:root{
  --y:#F6C92B; --bg:#0A0908; --card:#141210; --card2:#1C1916;
  --tx:#F2F0EB; --tx2:#A6A196; --line:#2A2723; --black:#1A1600;
  --wrap:1200px;
}
*{box-sizing:border-box;border-radius:0!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
.hd-title{font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
.meta{font-family:Oswald,sans-serif;font-weight:500;letter-spacing:.08em;text-transform:uppercase}

/* ---------- хедър ---------- */
header.top{background:var(--y);color:var(--black);position:sticky;top:0;z-index:205}
.top .wrap{display:flex;align-items:center;gap:24px;min-height:62px}
.logo{font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;font-size:20px;letter-spacing:-.03em;text-transform:uppercase;white-space:nowrap}
nav.main{display:flex;gap:18px;flex-wrap:wrap}
nav.main a{font-family:Oswald,sans-serif;font-weight:500;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:4px 0;border-bottom:2px solid transparent}
nav.main a:hover,nav.main a.on{border-bottom-color:var(--black)}
.srch{background:none;border:1px solid rgba(0,0,0,.35);color:var(--black);font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}
.srch:hover{background:rgba(0,0,0,.08)}
.ticker{background:#000;color:var(--y);overflow:hidden;white-space:nowrap;font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:7px 0}
.ticker span{display:inline-block;padding-right:60px}
.ticker-in{display:inline-block;animation:tick 34s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- секции ---------- */
main{padding-bottom:60px}
.pageload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:60vh;color:var(--tx2);font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.pl-clap{width:52px;height:52px;color:var(--y);overflow:visible}
.pl-clap path{fill:currentColor}
.pl-top{transform-origin:3px 9px;animation:plclap 1.8s ease-in-out infinite;animation-delay:.4s}
/* забавянето значи: на бърза връзка изчезва преди да се задейства анимацията — не мига */
@keyframes plclap{
  0%,100%{transform:rotate(0deg)}
  8%{transform:rotate(-22deg)}
  18%{transform:rotate(0deg)}
}
section{margin-top:46px}
.s-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;border-bottom:2px solid var(--y);padding-bottom:8px}
.s-head h2{margin:0;font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;font-size:26px;text-transform:uppercase;letter-spacing:-.02em;color:var(--y)}
.all{font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--y);border:1px solid var(--line);padding:6px 14px;white-space:nowrap}
.all:hover{background:var(--y);color:var(--black);border-color:var(--y)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.more{display:block;margin:18px auto;background:none;border:1px solid var(--line);color:var(--y);font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:9px 22px;cursor:pointer}
.more:hover{background:var(--y);color:var(--black);border-color:var(--y)}

/* карти */
.card{background:var(--card2);display:block;overflow:hidden}
.card:hover{outline:2px solid var(--y)}
.ph{background:var(--card);width:100%;object-fit:cover;display:block}
.r169{aspect-ratio:16/9}
.r23{aspect-ratio:2/3}
.cbody{padding:14px 14px 16px;display:flex;flex-direction:column}
.cdate{font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--y);margin-bottom:6px}
.ctitle{font-weight:700;font-size:15px;line-height:1.35;margin:0}
.clead{color:var(--tx2);font-size:13px;line-height:1.55;margin:7px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* новини: голяма + малки */
.news-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.news-lead{grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column}
.news-lead .ph{flex:1;min-height:0}
.news-lead .ctitle{font-size:22px;line-height:1.25}
.news-sm{background:var(--card2);display:flex;flex-direction:column;justify-content:center}

/* ревю карта */
.rev .ph{position:relative}
.rev-wrap{position:relative}
.claps{position:absolute;top:0;right:0;background:var(--black);color:var(--y);font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.06em;padding:4px 9px}
.rev-cap{position:absolute;left:0;bottom:0;background:var(--y);color:var(--black);font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;font-size:13px;text-transform:uppercase;padding:5px 10px;max-width:88%;line-height:1.2}

/* подкаст: широки редове */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:16px;background:var(--card2);padding:10px}
.row:hover{outline:2px solid var(--y)}
.row .rlink{display:flex;gap:16px;flex:1;min-width:0}
.row .thumb{flex:0 0 32%;max-width:340px}
.row .rbody{flex:1;min-width:0;padding:4px 4px 4px 0}
.row h3{margin:0 0 6px;font-size:17px;line-height:1.3;font-weight:700}

/* календар филтри */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters button{background:none;border:1px solid var(--line);color:var(--tx2);font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:6px 13px;cursor:pointer}
.filters button.on{background:var(--y);border-color:var(--y);color:var(--black)}
.filters.sub{margin-top:-6px;align-items:center}
.filters.sub:empty{margin:0}
.cal-plat,.cal-media{display:flex;gap:8px;flex-wrap:wrap}
.cal-media{padding-left:14px;border-left:1px solid var(--line)}
.cal-media button{opacity:.85}
.cal-when{font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--y)}
.pill{display:inline-block;background:var(--y);color:var(--black);font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;margin-top:6px}

/* ---------- жълта лента на рубрика ---------- */
.banner{background:var(--y);color:var(--black)}
.banner .wrap{display:flex;align-items:center;gap:20px;padding-top:10px;padding-bottom:10px;min-height:74px}
.banner h1{margin:0;flex:1;font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;font-size:34px;text-transform:uppercase;letter-spacing:-.02em;line-height:1}
.banner .bimg{flex:0 0 42%;max-width:520px;aspect-ratio:4/1;object-fit:cover}
.banner .count{font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.09em;text-transform:uppercase;opacity:.75}

/* ---------- статия ---------- */
.art-hd{background:var(--y);color:var(--black);padding:14px 0 18px}
.art-hd .wrap{max-width:1000px}
.crumbs{font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.7;margin-bottom:10px}
.art-hd .frame{background:var(--card);width:100%;aspect-ratio:16/9;object-fit:cover;outline:1px solid rgba(0,0,0,.12)}
.art-split{display:flex;gap:24px;align-items:flex-start}
.art-split .poster{flex:0 0 220px;aspect-ratio:2/3;object-fit:cover;background:var(--card);outline:1px solid rgba(0,0,0,.12)}
.art-split h1{margin:.1em 0 .3em;font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;font-size:34px;line-height:1.05;text-transform:uppercase;letter-spacing:-.02em}
.art-split .facts{font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.claps-big{font-size:0;text-align:center;margin:32px 0 0}
.claps-big .clapsrow{gap:6px}
.art-body{max-width:var(--wrap);margin:0 auto;padding:26px 20px 10px}

/* ---------- продукт (мърч): e-shop страница ---------- */
.shop-crumbs{font-family:Oswald,sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);margin:20px 0 22px}
.shop-grid{display:grid;grid-template-columns:minmax(0,520px) 1fr;gap:48px;align-items:start;padding-bottom:44px}
.shop-frame{aspect-ratio:1/1;background:var(--card2);border:1px solid var(--line);overflow:hidden}
.shop-frame img{width:100%;height:100%;object-fit:cover}
.shop-panel{position:sticky;top:20px}
.shop-panel h1{font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;font-size:28px;line-height:1.08;margin:0 0 14px}
.shop-stockline{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.shop-stockdot{width:8px;height:8px;border-radius:50%;background:var(--y)}
.shop-stockdot.out{background:#e07a76}
.shop-stocktxt{font-family:Oswald,sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--y)}
.shop-stocktxt.out{color:#e07a76}
.shop-price{font-family:Oswald,sans-serif;font-weight:700;font-size:30px;margin:0 0 16px}
.shop-desc{color:var(--tx2);font-size:15px;line-height:1.6;max-width:44ch;margin:0 0 26px}
.shop-sizes .lbl{font-family:Oswald,sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tx2);margin-bottom:10px}
.shop-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.shop-chip{font-family:Oswald,sans-serif;font-size:13px;font-weight:600;padding:10px 16px;border:1.5px solid var(--line);background:transparent;color:var(--tx);cursor:pointer}
.shop-chip.sel{background:var(--y);border-color:var(--y);color:var(--black)}
.shop-chip:hover:not(.sel){border-color:var(--y);color:var(--y)}
.shop-cta{width:100%;font-family:Oswald,sans-serif;font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:17px 24px;background:var(--y);color:var(--black);border:0;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px}
.shop-cta:hover{background:#ffd84a}
.shop-cta[aria-disabled="true"]{background:var(--card2);color:var(--tx2);pointer-events:none}
.shop-lower{max-width:var(--wrap);margin:0 auto;padding:0 20px 60px;display:grid;grid-template-columns:1.3fr 1fr;gap:48px;border-top:1px solid var(--line);padding-top:36px}
.shop-lower h2{font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;font-size:19px;margin:0 0 14px}
.shop-lower .prose{color:var(--tx2);font-size:15px;line-height:1.65;max-width:52ch}
.spec2 .row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.spec2 .row dt{color:var(--tx2);font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0}
.spec2 .row dd{margin:0;color:var(--tx);text-align:right}
@media(max-width:860px){
  .shop-grid{grid-template-columns:1fr;gap:24px}
  .shop-panel{position:static}
  .shop-lower{grid-template-columns:1fr;gap:26px}
}
/* ---------- мърч: grid витрина ---------- */
.shop-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pcard{background:var(--card2);display:flex;flex-direction:column;position:relative}
.pcard .shot{aspect-ratio:1/1;background:var(--card);position:relative;overflow:hidden}
.pcard .shot img{width:100%;height:100%;object-fit:cover}
.pbadge{position:absolute;top:10px;left:10px;font-family:Oswald,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px}
.pbadge.ok{background:var(--y);color:var(--black)}
.pbadge.out{background:var(--card);color:#e07a76;border:1px solid #7a2320}
.pcard .shot.dim img,.ph.dim{opacity:.35}
.pcard .cbody{padding:14px 15px 16px}
.pcard .prow{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px}
.pcard .price{font-family:Oswald,sans-serif;font-weight:600;font-size:16px;color:var(--y)}
.pcard .price.mute{color:var(--tx2)}
@media(max-width:900px){.shop-grid4{grid-template-columns:repeat(2,1fr)}}
.art-body h1{margin:.2em 0 .35em;font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;font-size:32px;line-height:1.1;text-transform:uppercase;letter-spacing:-.02em}
.art-meta{font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--y)}
.answer{border-left:4px solid var(--y);padding:2px 0 2px 16px;margin:20px 0 26px;font-size:19px;line-height:1.6}
.prose{font-size:17px;line-height:1.8}
.prose h2{font-family:Oswald,sans-serif;font-weight:600;font-size:22px;letter-spacing:.01em;margin:1.6em 0 .5em}
.prose blockquote{border-left:4px solid var(--y);margin:1.4em 0;padding-left:16px;color:var(--tx2)}
.prose a{color:var(--y);border-bottom:1px solid rgba(246,201,43,.4)}
.prose figure{margin:1.8em 0}
.prose figcaption{font-size:13px;color:var(--tx2);margin-top:6px}
.prose ul{padding-left:20px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:30px 0 0}
.tags a,.tag-off{display:inline-block;box-sizing:border-box;border:1px solid var(--line);font-family:Oswald,sans-serif;font-size:12px;line-height:1.3;letter-spacing:.07em;text-transform:uppercase;padding:5px 11px}
.tags a{color:var(--y)}
.tag-off{color:var(--tx2)}
.tags a:hover{background:var(--y);color:var(--black);border-color:var(--y)}
.sign{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);color:var(--tx2);font-size:15px}
.embed{position:relative;aspect-ratio:16/9;background:#000;margin:6px 0 0}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ---------- списък ---------- */
.list{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.li{display:flex;gap:18px;background:var(--card2);padding:12px;height:190px;overflow:hidden}
.li:hover{outline:2px solid var(--y)}
.li .lim{flex:0 0 30%;max-width:330px;height:100%;object-fit:cover;background:var(--card)}
.li .lim.r23{flex:0 0 132px}
.li .lb{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.li .card-btn{margin-top:auto;align-self:flex-end;flex:none}
.li .card-btn.dark{background:var(--y);color:var(--black)}
.li .card-btn.dark:hover{background:#ffd84a}
.li h3{margin:0 0 8px;font-size:19px;line-height:1.3;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pager{display:flex;justify-content:center;gap:6px;margin:28px 0 10px}
.pager a,.pager span{border:1px solid var(--line);color:var(--tx2);font-family:Oswald,sans-serif;font-size:13px;padding:6px 13px}
.pager .cur{background:var(--y);color:var(--black);border-color:var(--y)}
.kindtag{font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--y);margin-bottom:6px}

/* ---------- мърч / за нас ---------- */
.price{font-family:Oswald,sans-serif;color:var(--y);font-size:15px;letter-spacing:.05em;margin-top:6px}
.price.mute{color:var(--tx2)}
.about{background:var(--card2);padding:26px}
.about h3{margin:0 0 10px;font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;font-size:24px;text-transform:uppercase}
.btn{display:inline-block;background:var(--y);color:var(--black);font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:10px 20px;margin-top:12px;border:0;cursor:pointer}

footer{border-top:1px solid var(--line);margin-top:60px;padding:30px 0 50px;color:var(--tx2);font-size:14px}
footer a:hover{color:var(--y)}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}
.fgrid h4{font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx);margin:0 0 10px}

@media(max-width:900px){
  .grid4,.news-grid{grid-template-columns:repeat(2,1fr)}
  .news-lead{grid-column:span 2;grid-row:span 1}
  .banner .bimg{display:none}
  .art-split{flex-direction:column}
  .art-split .poster{flex:none;width:180px}
  .fgrid{grid-template-columns:1fr}
}
.s-head{flex-wrap:wrap;row-gap:10px}
@media(max-width:560px){
  .grid4{grid-template-columns:repeat(2,1fr)}
  .news-grid{grid-template-columns:1fr}
  .news-lead{grid-column:span 1}
  .row,.li{flex-direction:column;gap:10px;height:auto}
  .row .rlink{flex-direction:column;gap:10px}
  .row .thumb,.li .lim{flex:none;max-width:none;width:100%;height:auto;aspect-ratio:16/9}
  .li .lim.r23{width:140px;aspect-ratio:2/3}
  .banner h1{font-size:26px}
  .art-split h1,.art-body h1{font-size:25px}
}

/* =================================================================
   V1 → надградено върху V2 (виж correctionV2.docx)
   ================================================================= */

/* ---------- хедър: лого + бутони ---------- */
.bar{flex-wrap:wrap;row-gap:10px;height:auto;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.logo-mark{height:38px;width:auto;display:block;color:var(--black)}
.logo-mark path,.logo-mark rect{fill:currentColor}
.btxt b{display:block;font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;font-size:16px;letter-spacing:-.02em;text-transform:uppercase;line-height:1.1}
.btxt i{display:block;font-style:normal;font-family:Oswald,sans-serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-top:3px}
.hbtns{display:flex;align-items:center;gap:22px;margin-left:auto;flex-wrap:wrap;row-gap:10px}
.sbtn{width:34px;height:34px;border:1px solid rgba(0,0,0,.35);background:none;color:var(--black);cursor:pointer;display:grid;place-items:center;flex:none}

.btn-cal{display:inline-block;background:var(--black);color:var(--y);font-family:Oswald,sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;white-space:nowrap}
.btn-cal:hover{background:#000;color:#ffd84a}
.hmenu{display:none;width:38px;height:38px;border:1px solid rgba(0,0,0,.35);background:none;color:var(--black);cursor:pointer;place-items:center;flex:none;margin-left:auto}

/* ---------- секционни заглавия ---------- */
.s-head{align-items:flex-end;border-bottom:0;margin-bottom:16px;padding-bottom:0}
.headtx{flex:1;min-width:240px}
.eyebrow{font-family:Oswald,sans-serif;font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--y);margin:0 0 6px}
.s-head h2{border:0;padding:0;font-size:clamp(24px,3.6vw,36px);color:var(--tx)}
.lede{color:var(--tx2);max-width:62ch;margin:8px 0 0;font-size:14.5px;line-height:1.6}

/* ---------- по-голямо разстояние + светла линия между секциите (В1) ---------- */
main section.wrap{margin-top:0;padding-top:64px;padding-bottom:40px;border-top:1px solid var(--line)}
main section:first-child{border-top:0}

/* ---------- херо: последен епизод ---------- */
.hero{padding:36px 0 64px}
.hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:40px;align-items:stretch}
.hero-grid>div:first-child{display:flex;flex-direction:column}
.now{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--y);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{70%{box-shadow:0 0 0 11px rgba(246,201,43,0)}100%{box-shadow:0 0 0 0 rgba(246,201,43,0)}}
.hl-stack{display:flex;flex-direction:column;align-items:flex-start;gap:6px;transform:rotate(-1.2deg);margin:0 0 26px}
.hl{display:inline-block;background:var(--y);color:var(--black);font-family:Montserrat,sans-serif;font-weight:900;font-style:italic;font-size:clamp(24px,4vw,40px);text-transform:uppercase;letter-spacing:-.02em;padding:.08em .34em .12em;box-shadow:5px 6px 0 rgba(0,0,0,.35);line-height:1.05}
.hl-stack .hl:nth-child(2){margin-left:16px}
.hl-stack .hl:nth-child(3){margin-left:32px}
.hl-notch{clip-path:polygon(0 0,100% 0,100% calc(100% - 13px),calc(100% - 13px) 100%,0 100%)}
.ep-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:5px 10px;color:var(--tx2)}
.hero .lede{font-size:16px;margin:0 0 20px;max-width:none}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:auto;padding-top:16px}
.btn-gold,.btn-ghost{font-family:Oswald,sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:11px 18px;display:inline-flex;align-items:center;gap:8px;border:2px solid transparent;cursor:pointer}
.btn-gold{background:var(--y);color:var(--black)}
.btn-gold:hover{background:#ffd84a}
.btn-ghost{border-color:var(--line);color:var(--tx);background:none}
.btn-ghost:hover{border-color:var(--y);color:var(--y)}
.gframe{position:relative;background:var(--y);padding:12px 12px 0;display:flex;flex-direction:column}
.gframe .inner{position:relative;background:#000;overflow:hidden;aspect-ratio:16/10}
.gframe .inner>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gbar{position:absolute;height:4px;pointer-events:none;mix-blend-mode:screen;animation:gl 5.5s steps(1) infinite;z-index:2}
.gbar:nth-child(1){top:14%;left:0;width:38%;background:#39FF9B;animation-delay:.2s}
.gbar:nth-child(2){top:32%;right:0;width:26%;background:#FF3B5B;animation-delay:1.6s;height:7px}
.gbar:nth-child(3){bottom:22%;left:8%;width:20%;background:#fff;animation-delay:3.1s}
@keyframes gl{0%,92%{opacity:0}93%{opacity:.9}97%{opacity:.6}100%{opacity:0}}
.play{position:absolute;inset:0;display:grid;place-items:center;background:transparent;border:0;cursor:pointer;z-index:3}
.play i{width:56px;height:56px;border-radius:50%;background:var(--y);display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.5);transition:transform .2s}
.play:hover i{transform:scale(1.08)}
.gframe-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding:17px 0;font-family:Oswald,sans-serif;font-size:15px;line-height:1;letter-spacing:.07em;text-transform:uppercase;color:var(--black);font-weight:600}

/* ---------- клапи (SVG вместо ASCII) ---------- */
.clapsrow{display:inline-flex;gap:2px;align-items:center;line-height:0}
.clap{width:var(--cs,13px);height:var(--cs,13px);display:block;color:#6A6355;opacity:.55}
.clap.on{color:var(--y);opacity:1}

/* ---------- новини: голяма жълта карта + бутони ---------- */
.news-lead{background:var(--y);color:var(--black);display:flex;flex-direction:column}
.news-lead .ph{aspect-ratio:16/10;margin:0}
.news-lead .cbody{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}

.news-lead .ctitle{color:var(--black);font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;font-size:23px;text-transform:none;line-height:1.12}
.news-lead .clead{color:rgba(0,0,0,.72);-webkit-line-clamp:2}
.news-sm{gap:6px}
.card-btn{align-self:flex-start;margin-top:10px;font-family:Oswald,sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border:0;cursor:pointer}
.cbody .card-btn{margin-top:12px}
.card-btn.dark{background:var(--black);color:var(--y)}
.card-btn.dark:hover{background:#000}
.card-btn.gold{background:var(--y);color:var(--black)}

/* ---------- ревю карта: постер + клапи + линк ---------- */
.rev-wrap{position:relative;display:flex;flex-direction:column}
.rev-wrap .score{position:absolute;top:0;right:0;z-index:3;background:var(--black);color:var(--y);font-family:Montserrat,sans-serif;font-weight:900;font-style:italic;padding:8px 10px 9px 14px;clip-path:polygon(12px 0,100% 0,100% 100%,0 100%);text-align:center;line-height:1}
.rev-wrap .score small{display:block;font-family:Oswald,sans-serif;font-style:normal;font-size:8px;letter-spacing:.14em;margin-top:3px;opacity:.75;font-weight:600}
.rev-wrap .hl-stack{position:absolute;left:10px;bottom:32px;z-index:2;transform:rotate(-2deg);gap:4px;margin:0}
.rev-wrap .hl-stack .hl{font-size:14px;box-shadow:3px 4px 0 rgba(0,0,0,.4);padding:.06em .3em .1em}
.rev-wrap .hl-stack .hl:nth-child(2){margin-left:8px}
.rev-wrap .hl-stack .hl:nth-child(3){margin-left:16px}
.rev-wrap .yr{position:absolute;left:12px;bottom:12px;z-index:2;font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.85);text-transform:uppercase}
.rev-body{padding:12px 13px 15px;display:flex;flex-direction:column;gap:7px}
.rev-body .genre{font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--y);font-weight:600}
.rev-body p{font-size:13px;line-height:1.5;color:var(--tx2);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rev-more{font-family:Oswald,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-top:auto}
.rev-more::after{content:" →";color:var(--y)}

/* ---------- зад кадър: рибон + бутон ---------- */
.craft-card{position:relative}
.craft-tab{position:absolute;top:0;left:0;z-index:2;background:var(--y);color:var(--black);font-family:Oswald,sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:6px 14px 6px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.craft-card .ph{position:relative}
.craft-card .card-btn{margin-top:auto;align-self:flex-end}

/* ---------- movie calendar карта ---------- */
.cal-art{position:relative}
.cal-art::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(0,0,0,.75),transparent 42%);pointer-events:none}
.cal-tab{position:absolute;top:0;left:0;z-index:2;background:var(--y);color:var(--black);font-family:Oswald,sans-serif;font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:6px 13px 6px 9px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.cal-tab2{position:absolute;top:26px;left:0;z-index:2;background:var(--black);color:var(--y);font-family:Oswald,sans-serif;font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px 5px 9px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.cal-when{position:absolute;left:10px;bottom:10px;z-index:2;font-family:Oswald,sans-serif;font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--y);text-shadow:0 1px 4px rgba(0,0,0,.8)}

/* ---------- подкаст: горни бутони ---------- */
.pod-actions{display:flex;gap:8px;flex-wrap:wrap}
.row .watch{align-self:flex-end;flex:none;margin-left:auto}

/* ---------- за нас ---------- */
.about-title{font-size:clamp(22px,3.6vw,32px);font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;line-height:1.08;margin:0}
.about-cta{margin:22px 0 50px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.about-cta p{font-family:Montserrat,sans-serif;font-style:italic;font-weight:900;font-size:18px;text-transform:uppercase;margin:0}

/* ---------- футър: жълт, 4 колони ---------- */
footer{background:var(--y);color:var(--black);border-top:0;margin-top:60px;padding:44px 0 26px}
footer a:hover{color:#000;text-decoration:underline}
.fgrid{grid-template-columns:1.6fr 1fr 1fr 1fr}
.fgrid h4{color:rgba(0,0,0,.6)}
.fgrid p,.fgrid a{color:var(--black)}

/* ---------- търсене (overlay вместо prompt) ---------- */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(4,4,3,.78);display:none}
.overlay.open{display:block}
.searchbox{position:fixed;z-index:210;left:50%;top:11vh;transform:translateX(-50%);width:min(640px,94vw);background:var(--card2);border:1px solid var(--line);display:none}
.searchbox.open{display:block}
.s-field{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--tx2)}

.s-clear{margin-left:auto;background:none;border:0;color:var(--tx2);font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}

<script>
"use strict";

/* ---------- данни ---------- */
/* до първото зареждане на /api/content показваме празна, но валидна форма */
var D = {settings:{},heads:{},tagLabels:{},reviews:[],news:[],craft:[],episodes:[],merch:[],calendar:[]};

/* V1 → V2, за да работи и срещу истинското /api/content */
function normalize(raw){
  if(!raw || !raw.reviews) return null;
  if(raw.tagLabels) return raw;
  var lab={};
  function tg(a){return (a||[]).map(function(t){var s=String(t).trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");if(!s)return null;lab[s]=lab[s]||String(t).trim();return s;}).filter(Boolean);}
  var o={settings:raw.settings||{},heads:raw.heads||{},tagLabels:lab,
    reviews:(raw.reviews||[]).map(function(r){return{id:r.id,t:r.t,when:r.when||"",y:r.y,g:r.g,s:+r.s||0,mins:r.mins,poster:r.poster||"",share:"",video:r.video||"",trailer:r.trailer||"",lead:r.verdict||"",body:r.body||"",tags:tg(r.tags),status:r.status||"published",authorName:r.authorName||""};}),
    news:(raw.news||[]).map(function(n){return{id:n.id,t:n.t,when:n.when||"",cat:n.tag||"",img:n.img||"",video:n.video||"",trailer:n.trailer||"",lead:n.p||"",body:n.body||"",tags:tg(n.tags),status:n.status||"published",authorName:n.authorName||"",source:"",sourceUrl:""};}),
    craft:(raw.craft||[]).map(function(c){return{id:c.id,t:c.t,when:c.when||"",cat:c.tag||"",img:c.img||"",video:c.video||"",trailer:c.trailer||"",guest:c.guest||"",role:c.role||"",lead:c.p||"",body:c.body||"",tags:tg(c.tags),status:c.status||"published",authorName:c.authorName||""};}),
    episodes:(raw.episodes||[]).map(function(e){return{id:e.id,n:e.n,t:e.t,when:e.d||"",cat:e.tag||"",lead:e.desc||"",body:"",yt:e.yt||"",sp:e.sp||"",len:e.len,tags:tg(e.tags),status:"published",authorName:""};}),
    merch:(raw.merch||[]).map(function(m){return{id:m.id,t:m.t,lead:m.d||"",body:"",price:+m.p||0,sizes:m.sizes||[],img:m.img||"",on:!!m.on,tags:[],status:"published"};}),
    calendar:(raw.calendar||[])};
  o.calendar.forEach(function(c){c.tags=tg(c.tags);});
  return o;
}

/* ---------- дреболии ---------- */
var MON=["януари","февруари","март","април","май","юни","юли","август","септември","октомври","ноември","декември"];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function dt(s){if(!s)return"";var p=String(s).slice(0,10).split("-");if(p.length<3)return s;return (+p[2])+" "+MON[+p[1]-1]+" "+p[0];}
function slugify(s){
  var m={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sht","ъ":"a","ь":"","ю":"yu","я":"ya"};
  return String(s||"").toLowerCase().split("").map(function(c){return m[c]!==undefined?m[c]:c;}).join("")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,70)||"bez-zaglavie";
}
/* същата опашка като в Worker-а, за да не се сменят адресите */
function idTail(id){
  var m=/([a-z0-9]{4,})$/i.exec(String(id||""));
  return (m?m[1]:String(id||"x")).toLowerCase().slice(-6);
}
function ytId(u){var m=/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{6,})/.exec(u||"");return m?m[1]:"";}
function ytThumb(u){var i=ytId(u);return i?"https://i.ytimg.com/vi/"+i+"/maxresdefault.jpg":"";}
function ytThumbAlt(u){var i=ytId(u);return i?"https://i.ytimg.com/vi/"+i+"/hqdefault.jpg":"";}
var CLAP='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+
  '<path d="M2 8.7h20V20a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 2 20V8.7Z"/>'+
  '<path d="M2.2 4.8 20.3 1.9l.9 4.3L3.1 9.1 2.2 4.8Z"/>'+
  '<path d="M7 3.6 8.5 7.8M11.9 2.8l1.5 4.2M16.8 2l1.5 4.2" stroke="#0A0908" stroke-width="1.2" fill="none"/></svg>';
function claps(n,size){
  n=Math.max(0,Math.min(5,Math.round(+n||0)));
  var out='<span class="clapsrow" style="--cs:'+(size||13)+'px" title="'+n+' от 5" aria-label="Оценка '+n+' от 5">';
  for(var i=1;i<=5;i++) out+='<i class="clap'+(i<=n?" on":"")+'">'+CLAP+"</i>";
  return out+"</span>";
}
function titleBlocks(t,limit){
  var w=String(t||"").split(" "), lines=[], cur="", L=limit||15;
  w.forEach(function(x){ if((cur+" "+x).trim().length>L){ if(cur) lines.push(cur); cur=x; } else cur=(cur+" "+x).trim(); });
  if(cur) lines.push(cur);
  return lines.slice(0,3).map(function(l,i,a){
    return '<span class="hl'+(i===a.length-1?" hl-notch":"")+'">'+esc(l)+"</span>";
  }).join("");
}
function txt(s){return String(s||"").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();}

/* ---------- movie calendar: помощни ---------- */
function subLabel(c){
  if(String(c.note||"").trim()) return c.note;
  if(c.sub==="series") return "Нов сериал";
  if(c.sub==="season") return c.season?("Сезон "+c.season):"Нов сезон";
  if(c.sub==="episode") return (c.season&&c.episode)?("S"+c.season+" · E"+c.episode):"Нов епизод";
  return "";
}
function calCat(c){
  if(c.kind==="event") return c.organizer||"Събитие";
  if(c.kind==="stream") return c.platform||"Стрийминг";
  return "По кината";
}
function reviewFor(c){
  var t=String(c.t||"").trim().toLowerCase(); if(!t) return null;
  return items("reviews").filter(function(r){return String(r.t||"").trim().toLowerCase()===t;})[0]||null;
}

/* тагове от типа ![подпис](inline:N) → истинския адрес на снимката, пазена отделно в it.inlineImages */
function resolveInlineImages(text,images){
  if(!images||!images.length) return text;
  return String(text||"").replace(/\(inline:(\d+)\)/g,function(m,idx){
    var img=images[+idx];
    return img&&img.data?"("+img.data+")":m;
  });
}
function md(s){
  var out=String(s||"").split(/\n{2,}/).map(function(b){
    b=b.trim(); if(!b) return "";
    var img=/^!\[([^\]]*)\]\(([^)]+)\)$/.exec(b);
    if(img) return '<figure><img src="'+esc(img[2])+'" alt="'+esc(img[1])+'">'+(img[1]?'<figcaption>'+esc(img[1])+'</figcaption>':'')+'</figure>';
    if(/^##\s+/.test(b)) return "<h2>"+inl(b.replace(/^##\s+/,""))+"</h2>";
    if(/^>\s+/.test(b)) return "<blockquote>"+inl(b.replace(/^>\s+/gm,""))+"</blockquote>";
    if(/^[-•]\s+/m.test(b)) return "<ul>"+b.split(/\n/).map(function(l){return "<li>"+inl(l.replace(/^[-•]\s+/,""))+"</li>";}).join("")+"</ul>";
    return "<p>"+inl(b).replace(/\n/g,"<br>")+"</p>";
  }).join("");
  return out;
  function inl(t){
    return esc(t)
      .replace(/!\[([^\]]*)\]\((\/[^)\s]+|https?:\/\/[^)\s]+)\)/g,'<img src="$2" alt="$1">')
      .replace(/\[([^\]]+)\]\((\/[^)\s]+|https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g,"<em>$1</em>");
  }
}

/* ---------- рубрики ---------- */
var KIND={
  news:     {path:"novina", list:"novini",    label:"Новини",        img:"img",    shape:"h"},
  reviews:  {path:"revyu",  list:"revyuta",   label:"Ревюта",        img:"poster", shape:"p"},
  episodes: {path:"epizod", list:"podkast",   label:"Подкаст",       img:"",       shape:"h"},
  craft:    {path:"zad-kadar",list:"zad-kadar",label:"Зад кадър",    img:"img",    shape:"h"},
  merch:    {path:"produkt",list:"march",     label:"Мърч",          img:"img",    shape:"h"},
  calendar: {path:"kalendar",list:"kalendar", label:"Movie calendar",img:"poster", shape:"p"}
};
var PER_PAGE=8, EP_HOME=4;

function items(k){return (D[k]||[]).filter(function(i){
  if((i.status||"published")!=="published") return false;
  if(k==="calendar"&&i.hidden) return false;
  return true;
});}
function url(k,it){return "/"+KIND[k].path+"/"+slugify(it.t)+"-"+idTail(it.id);}
/* жанр може да е стар единичен низ или нов списък — навсякъде се показва като списък */
function genreArr(v){return Array.isArray(v)?v:(v?[v]:[]);}
function genreTxt(v){return genreArr(v).join(", ");}
function pic(k,it){
  if(k==="episodes") return ytThumb(it.yt);
  if(k==="calendar") return it.poster||"";
  return it[KIND[k].img]||"";
}
/* хоризонтална снимка — backdrop от TMDB, ако го има, иначе изрязан постер */
function picWide(k,it){
  if(k==="calendar") return it.backdrop||it.poster||"";
  return pic(k,it);
}
function tagLabel(s){return D.tagLabels&&D.tagLabels[s]?D.tagLabels[s]:s;}
function tagCount(s){
  var n=0;["reviews","news","craft","episodes","calendar"].forEach(function(k){
    items(k).forEach(function(i){if((i.tags||[]).indexOf(s)>=0)n++;});});
  return n;
}
function byTag(s){
  var out=[];["reviews","news","craft","episodes"].forEach(function(k){
    items(k).forEach(function(i){if((i.tags||[]).indexOf(s)>=0)out.push({k:k,i:i});});});
  return out.sort(function(a,b){return (b.i.when||"").localeCompare(a.i.when||"");});
}

/* ---------- карти ---------- */
function cardH(k,it){
  var p=pic(k,it);
  if(k==="craft"){
    var who=[it.authorName].filter(Boolean).join(", ");
    return '<a class="card craft-card" href="'+url(k,it)+'" data-nav>'+
      '<div class="ph r169" style="position:relative">'+
      (p?'<img class="ph r169" src="'+esc(p)+'" alt="'+esc(it.t)+'" loading="lazy" style="position:absolute;inset:0">':'')+
      (it.cat?'<span class="craft-tab">'+esc(it.cat)+'</span>':'')+'</div>'+
      '<div class="cbody"><h3 class="ctitle">'+esc(it.t)+'</h3>'+
      (it.lead?'<p class="clead">'+esc(txt(it.lead))+'</p>':'')+
      '<div class="cdate">Статия'+(it.when?' · '+dt(it.when):'')+(who?' · разказва '+esc(who):'')+'</div>'+
      '<button class="card-btn gold" type="button">Виж повече</button></div></a>';
  }
  if(k==="merch"){
    return '<a class="card" href="'+url(k,it)+'" data-nav>'+
      '<div style="position:relative">'+
      (p?'<img class="ph r169'+(it.on?"":" dim")+'" src="'+esc(p)+'" alt="'+esc(it.t)+'" loading="lazy">':'<div class="ph r169"></div>')+
      '<span class="pbadge '+(it.on?"ok":"out")+'">'+(it.on?"Налично":"Изчерпано")+'</span>'+
      '</div>'+
      '<div class="cbody"><h3 class="ctitle">'+esc(it.t)+'</h3>'+
      (it.lead?'<p class="clead">'+esc(txt(it.lead))+'</p>':'')+
      '<div class="price'+(it.on?"":" mute")+'">'+it.price+' €</div>'+
      '<button class="card-btn'+(it.on?" gold order":"")+'" type="button"'+(it.on?"":" disabled")+'>'+(it.on?"Поръчай":"Изчерпано")+'</button></div></a>';
  }
  return '<a class="card" href="'+url(k,it)+'" data-nav>'+
    (p?'<img class="ph r169" src="'+esc(p)+'" alt="'+esc(it.t)+'" loading="lazy">':'<div class="ph r169"></div>')+
    '<div class="cbody">'+(it.when?'<div class="cdate">'+dt(it.when)+'</div>':'')+
    '<h3 class="ctitle">'+esc(it.t)+'</h3>'+(it.lead?'<p class="clead">'+esc(txt(it.lead))+'</p>':'')+'</div></a>';
}
function cardP(k,it){
  var p=pic(k,it);
  if(k==="reviews"){
    var bg=p?'background-image:url('+esc(p)+');background-size:cover;background-position:center':"";
    return '<a class="card" href="'+url(k,it)+'" data-nav><div class="rev-wrap r23" style="'+bg+'">'+
      '<div class="score">'+claps(it.s,11)+'<small>MIM</small></div>'+
      '<div class="hl-stack">'+titleBlocks(it.t)+'</div>'+
      '<div class="yr">'+esc(it.y||"")+(genreArr(it.g).length?" • "+esc(genreTxt(it.g)):"")+'</div>'+
      '</div><div class="rev-body">'+(genreArr(it.g).length?'<span class="genre">'+esc(genreTxt(it.g))+'</span>':"")+
      (it.lead?'<p>'+esc(txt(it.lead))+'</p>':"")+
      '<span class="rev-more">Прочети ревюто</span></div></a>';
  }
  /* movie calendar карта — платформа/тип горе вляво, епизод под нея, дата долу вляво */
  var tab1=calCat(it), tab2=it.kind==="stream"?subLabel(it):"", past=String(it.when||"")<todayISO();
  var formatTxt=it.kind==="event"?"Събитие":(it.kind==="stream"?(it.sub?"Сериал":"Филм"):"По кината");
  return '<a class="card cal-card" href="'+url(k,it)+'" data-nav>'+
    '<div class="cal-art">'+
    (p?'<img class="ph r23" src="'+esc(p)+'" alt="'+esc(it.t)+'" loading="lazy">':'<div class="ph r23"></div>')+
    '<span class="cal-tab">'+esc(tab1)+'</span>'+
    (tab2?'<span class="cal-tab2">'+esc(tab2)+'</span>':'')+
    '<span class="cal-when">'+esc(past?"вече е налично":dt(it.when))+'</span>'+
    '</div>'+
    '<div class="cbody"><h3 class="ctitle">'+esc(it.t)+'</h3>'+
    '<div class="cdate">'+esc((it.kind==="event"?[it.price?("от "+it.price+" €"):"",it.place]:[it.platform]).concat([formatTxt]).filter(Boolean).join(" · "))+'</div></div></a>';
}
function card(k,it){return KIND[k].shape==="p"?cardP(k,it):cardH(k,it);}
function rowEp(it){
  var p=ytThumb(it.yt), alt=ytThumbAlt(it.yt);

function calList(view){
  var all=items("calendar").filter(function(c){return (c.when||"")>=todayISO();});
  all.sort(function(a,b){return (a.when||"").localeCompare(b.when||"");});
  if(view!=="all") all=all.filter(function(c){return (c.kind||"")===view;});
  if(view==="stream"){
    if(calPlatform) all=all.filter(function(c){return (c.platform||"")===calPlatform;});
    if(calMedia==="movie") all=all.filter(function(c){return !c.sub;});

function calStreamPlatforms(){
  var all=items("calendar").filter(function(c){return (c.when||"")>=todayISO()&&c.kind==="stream";});
  var seen={}, out=[];
  all.forEach(function(c){var p=c.platform||"Друго"; if(!seen[p]){seen[p]=0;out.push(p);} seen[p]++;});
  return out.map(function(p){return [p,seen[p]];});

function otherTags(cur){

/* ---------- статия ---------- */
function article(kindKey,id){
  var it=items(kindKey).filter(function(x){return x.id===id;})[0];
  if(!it){ notFound(); return; }
  var K=KIND[kindKey], h="";
  var noBand = kindKey==="calendar"||kindKey==="reviews";
  var p = noBand ? (it.poster||"") : picWide(kindKey,it);

  /* единна лента за всички видове: текст+тагове+бутони вляво, хоризонтална снимка (1/3 екран) вдясно */
  /* календар/ревю: без жълта лента, вертикален постер вдясно — виж noBand по-долу */
  var facts=[], extraHead="";
  if(kindKey==="calendar"){
    var past=String(it.when||"")<todayISO();
    facts=[calCat(it), it.kind==="stream"?subLabel(it):"", past?"вече е налично":dt(it.when)].filter(Boolean);
    var chips=[it.time,it.place,it.kind==="event"&&it.price?("от "+it.price+" €"):""].concat(genreArr(it.genre),[it.mins?(it.mins+" мин"):"",it.kind!=="stream"?subLabel(it):""]).filter(Boolean);
    if(chips.length) extraHead='<div class="ep-meta">'+chips.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join("")+'</div>';
  } else if(kindKey==="reviews"){
    facts=[K.label, it.y, genreTxt(it.g), it.mins?it.mins+" мин":""].filter(Boolean);
  } else {
    facts=[K.label];
    if(it.when) facts.push(dt(it.when));
    if(it.cat) facts.push(it.cat);
    if(kindKey==="craft"){ var who=[it.guest,it.role].filter(Boolean).join(", "); if(who) facts.push(who); }
    if(kindKey==="episodes"&&it.n) facts.push("Епизод "+it.n);
  }
  var media = (kindKey==="episodes"&&ytId(it.yt))
    ? '<div class="embed art-media"><iframe src="https://www.youtube.com/embed/'+ytId(it.yt)+'" title="'+esc(it.t)+'" allowfullscreen loading="lazy"></iframe></div>'
    : (p?'<img class="art-media" src="'+esc(p)+'" alt="'+esc(it.t)+'">':'<div class="art-media"></div>');
  var titleHTML = noBand ? '<h1 class="hl-stack">'+titleBlocks(it.t,20)+'</h1>' : '<h1>'+esc(it.t)+'</h1>';
  var topInner = '<div class="facts">'+esc(facts.join(" · "))+'</div>'+titleHTML;
  if(kindKey==="reviews"){
    topInner += (it.lead?'<div class="answer art-lede">'+esc(txt(it.lead))+'</div>':'');
  } else {
    topInner += extraHead+tagsHTML(it)+
      (it.lead?'<div class="answer art-lede">'+esc(txt(it.lead))+'</div>':'')+
      likeShareHTML(kindKey,it);
  }
  h+='<div class="art-hd'+(noBand?" no-band":"")+'"><div class="wrap"><div class="crumbs">Начало › '+esc(K.label)+'</div>'+
    '<div class="art-split">'+
    '<div class="art-left">'+topInner+'</div>'+media+
    '</div></div></div>';

  h+='<div class="art-body">';
  if(it.guest) h+='<div class="art-meta" style="color:var(--tx2)">Гост: '+esc(it.guest)+(it.role?' · '+esc(it.role):'')+'</div>';
  if(kindKey!=="episodes"&&kindKey!=="calendar"&&it.video&&ytId(it.video))
    h+='<div class="embed"><iframe src="https://www.youtube.com/embed/'+ytId(it.video)+'" title="видео" allowfullscreen loading="lazy"></iframe></div>';
  var bodyTxt=kindKey==="calendar"?(it.body||it.p):it.body;
  if(bodyTxt) h+='<div class="prose">'+md(resolveInlineImages(bodyTxt,it.inlineImages))+'</div>';

  if(kindKey==="merch"){
    h+='<div class="prose"><p class="price">'+it.price+' €</p>'+
      (it.sizes&&it.sizes.length?'<p>Размери: '+esc(it.sizes.join(", "))+'</p>':'')+
      '<p>'+(it.on?"Налично":"В момента не е налично")+'</p></div>'+
      '<a class="btn" href="mailto:'+esc(D.settings.orderEmail||"")+'?subject='+encodeURIComponent("Поръчка: "+it.t)+'">Поръчай</a>';
  }
  if(kindKey==="episodes"&&it.sp) h+='<a class="btn" href="'+esc(it.sp)+'" target="_blank" rel="noopener">Слушай в Spotify</a>';

  if(kindKey==="reviews") h+='<div class="claps-big">'+claps(it.s,26)+'</div>';
  if(it.authorName) h+='<div class="sign">— '+esc(it.authorName)+'</div>';
  if(kindKey==="reviews") h+=likeShareHTML(kindKey,it)+tagsHTML(it);

  var rel=[]; (it.tags||[]).forEach(function(s){byTag(s).forEach(function(x){
    if(x.i.id!==it.id&&rel.filter(function(y){return y.i.id===x.i.id;}).length===0) rel.push(x);});});
  if(rel.length) h+='<div style="margin-top:40px"><div class="s-head"><h2 style="font-size:20px">Още по темата</h2></div>'+
    '<div class="grid4">'+rel.slice(0,4).map(function(x){return card(x.k,x.i);}).join("")+'</div></div>';

  h+='</div>';
  document.getElementById("app").innerHTML=h;
  document.title=(kindKey==="reviews"? it.t+" ("+it.y+") — ревю" : it.t)+" — Men In A Movie";
  var CKIND={reviews:"r",news:"n",craft:"c",episodes:"e",calendar:"k"}[kindKey];
  if(CKIND) wireLikeShare(CKIND,it.id);
  if(kindKey==="calendar"&&it.src==="tmdb"&&it.tmdbId) enrichCalTmdb(it);
}
/* трейлър/резюме/оценка от TMDB — теглят се асинхронно, за да не бавят зареждането на страницата */
function enrichCalTmdb(it){
  if(it.video) return;
  var media=it.kind==="cinema"?"movie":"tv";
  var qs="id="+encodeURIComponent(it.tmdbId)+"&media="+media;
  if(it.sub==="episode"&&it.season&&it.episode) qs+="&season="+it.season+"&episode="+it.episode;
  fetch("/api/tmdb-extra?"+qs).then(function(r){return r.ok?r.json():null;}).then(function(x){
    if(!x) return;
    if(x.trailer){
      var btns=document.querySelector(".art-left .btns");
      if(btns&&!btns.querySelector('a[href="'+x.trailer+'"]')){
        var a=document.createElement("a");
        a.className="btn gold"; a.target="_blank"; a.rel="noopener"; a.href=x.trailer; a.textContent="Виж трейлъра";
        btns.insertBefore(a,btns.firstChild);
      }
    }
    if(x.overview){
      var lede=document.querySelector(".art-left .art-lede");
      if(!lede){
        var left=document.querySelector(".art-left"), btns2=left&&left.querySelector(".btns");
        if(left){
          lede=document.createElement("div");
          lede.className="answer art-lede";
          if(btns2) left.insertBefore(lede,btns2); else left.appendChild(lede);
        }
      }
      if(lede) lede.textContent=x.overview;
      var body=document.querySelector(".art-body"), prose=body&&body.querySelector(".prose");
      if(!prose&&body){
        prose=document.createElement("div");
        prose.className="prose";
        body.insertBefore(prose,body.firstChild);
      }
      if(prose) prose.textContent=x.overview;
    }
    if(x.rating){
      var facts=document.querySelector(".art-left .facts");
      if(facts) facts.textContent=facts.textContent+" · TMDB "+x.rating+"/10";
    }
  }).catch(function(){});
}
function tagsHTML(it){
  var tg=(it.tags||[]).filter(Boolean);
  if(!tg.length) return "";
  return '<div class="tags">'+tg.map(function(s){
    return tagCount(s)>1 ? '<a href="/tema/'+s+'" data-nav>'+esc(tagLabel(s))+'</a>'
                         : '<span class="tag-off">'+esc(tagLabel(s))+'</span>';
  }).join("")+'</div>';
}
function likeShareHTML(kindKey,it){
  var CKIND={reviews:"r",news:"n",craft:"c",episodes:"e",calendar:"k"}[kindKey];
  if(!CKIND) return "";
  var listen = kindKey!=="episodes"&&kindKey!=="calendar"&&it.video ? '<a class="btn gold" target="_blank" rel="noopener" href="'+esc(it.video)+'">Чуй повече</a>' : "";
  var trailerBtn = kindKey!=="episodes"&&kindKey!=="calendar"&&it.trailer ? '<a class="btn" target="_blank" rel="noopener" href="'+esc(it.trailer)+'">Виж трейлъра</a>' : "";
  var calBtns="";
  if(kindKey==="calendar"){
    if(it.video) calBtns+='<a class="btn gold" target="_blank" rel="noopener" href="'+esc(it.video)+'">Виж трейлъра</a>';
    if(it.kind==="event"&&it.ticketUrl) calBtns+='<a class="btn gold" target="_blank" rel="noopener" href="'+esc(it.ticketUrl)+'">Билети</a>';
    if(it.kind==="stream"&&it.watchUrl) calBtns+='<a class="btn gold" target="_blank" rel="noopener" href="'+esc(it.watchUrl)+'">Гледай в '+esc(it.platform||"платформата")+'</a>';
    if(it.kind==="cinema"&&D.settings.cinemaProgramUrl) calBtns+='<a class="btn" target="_blank" rel="noopener" href="'+esc(D.settings.cinemaProgramUrl)+'">Програма по кината</a>';
    var rv=reviewFor(it);
    if(rv) calBtns+='<a class="btn" href="'+url("reviews",rv)+'" data-nav>Прочети ревюто</a>';
  }
  return '<div class="btns">'+
    '<button class="btn like" id="lk" type="button" aria-label="Харесай">'+
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+
    '<path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 22l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>'+
    '<span id="lkn"></span></button>'+
    '<button class="btn" id="shr" type="button">Сподели</button>'+trailerBtn+listen+calBtns+'</div>';
}

/* ---------- харесване + споделяне (същите ключове като на сървъра) ---------- */
function wireLikeShare(ckind,id){
  var K=ckind+":"+id, B=document.getElementById("lk"), N=document.getElementById("lkn"), S=document.getElementById("shr");
  function rd(store,k){try{return JSON.parse(store.getItem(k)||"{}");}catch(e){return{};}}
  function mine(){return !!rd(localStorage,"mim-likes")[K];}
  function paint(n){
    if(n!=null&&N) N.textContent=n||"";
    if(!B) return;
    B.classList.toggle("on",mine());
    var v=B.querySelector("svg"); if(v) v.setAttribute("fill",mine()?"currentColor":"none");
  }
  function hit(o){return fetch("/api/hit",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(o)})
    .then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}
  paint(null);
  fetch("/api/stats",{cache:"no-store"}).then(function(r){return r.ok?r.json():null;})
    .then(function(j){if(j)paint((j.likes||{})[K]||0);}).catch(function(){});
  if(B) B.addEventListener("click",function(){
    var on=!mine(), m=rd(localStorage,"mim-likes");
    if(on) m[K]=1; else delete m[K];
    try{localStorage.setItem("mim-likes",JSON.stringify(m));}catch(e){}
    paint(null);
    hit({kind:ckind,id:id,like:on}).then(function(j){if(j)paint(j.likes);});
  });
  try{
    var seen=rd(sessionStorage,"mim-seen");
    if(!seen[K]){ seen[K]=1; sessionStorage.setItem("mim-seen",JSON.stringify(seen)); hit({kind:ckind,id:id}); }
  }catch(e){}
  if(S) S.addEventListener("click",function(){
    var u=location.href;
    if(navigator.share){ navigator.share({title:document.title,url:u}).catch(function(){}); return; }
    if(navigator.clipboard) navigator.clipboard.writeText(u).then(function(){
      var t=S.textContent; S.textContent="Копирано"; setTimeout(function(){S.textContent=t;},1600);
    });
  });
}

/* ---------- маршрути ---------- */
function route(){
  var path=location.pathname;
  if(location.protocol==="file:"||path.indexOf("/")!==0) path=location.hash.replace(/^#/,"")||"/";
  if(path==="/"||path===""||/\.html?$/.test(path)){
    home(); document.title="Men In A Movie — кино, подкаст и ревюта"; markNav("");
    var hid=location.hash.replace(/^#/,""), hel=hid&&document.getElementById(hid);
    if(hel) hel.scrollIntoView({behavior:"smooth"}); else window.scrollTo(0,0);
    return;
  }
  var seg=path.split("/").filter(Boolean);
  var lists={novini:"news",revyuta:"reviews",podkast:"episodes","zad-kadar":"craft",march:"merch",kalendar:"calendar"};
  if(seg[0]==="tema"&&seg[1]){ tagPage(seg[1]); markNav(""); window.scrollTo(0,0); return; }
  if(lists[seg[0]]&&(!seg[1]||/^\d+$/.test(seg[1]))){ listPage(lists[seg[0]],+seg[1]||1); markNav(seg[0]); window.scrollTo(0,0); return; }
  var byPath={novina:"news",revyu:"reviews",epizod:"episodes","zad-kadar":"craft",produkt:"merch",kalendar:"calendar"};
  if(byPath[seg[0]]&&seg[1]){
    var k=byPath[seg[0]];
    var tail=seg[1].split("-").slice(-1)[0].toLowerCase();
    var found=items(k).filter(function(x){return idTail(x.id)===tail;})[0];
    if(!found) found=items(k).filter(function(x){return String(x.id).toLowerCase()===tail||slugify(x.t)+"-"+idTail(x.id)===seg[1];})[0];
    if(found){ (k==="merch"?merchPage(found):article(k,found.id)); markNav(KIND[k].list); window.scrollTo(0,0); return; }
  }
  notFound(); window.scrollTo(0,0);
}
function markNav(list){
  [].forEach.call(document.querySelectorAll("#nav a"),function(a){
    a.classList.toggle("on", a.getAttribute("data-list")===list);});
}
function go(href){
  if(location.protocol==="file:"){ location.hash=href; return; }
  history.pushState({},"",href); route();
}
document.addEventListener("click",function(e){
  var a=e.target.closest?e.target.closest("a[data-nav]"):null;
  if(a){ e.preventDefault(); go(a.getAttribute("href")); return; }
  var m=e.target.closest?e.target.closest("[data-more]"):null;
  if(m){ var w=m.getAttribute("data-more");
    if(w==="news") renderNews(newsPages+1);
    if(w==="reviews") renderRev(revPages+1);
    if(w==="calendar") renderCal(calView,calPages+1);
    return; }
  var c=e.target.closest?e.target.closest("[data-cal]"):null;
  if(c){ renderCal(c.getAttribute("data-cal"),1); return; }
  var pf=e.target.closest?e.target.closest("[data-platform]"):null;
  if(pf){ calPlatform=pf.getAttribute("data-platform"); renderCal("stream",1); return; }
  var md=e.target.closest?e.target.closest("[data-media]"):null;
  if(md){ calMedia=md.getAttribute("data-media"); renderCal("stream",1); return; }
  var lc=e.target.closest?e.target.closest("[data-lpcal]"):null;
  if(lc){ renderLpCal(lc.getAttribute("data-lpcal"),1); return; }
  var lpf=e.target.closest?e.target.closest("[data-lpplatform]"):null;
  if(lpf){ lpCalPlatform=lpf.getAttribute("data-lpplatform"); renderLpCal("stream",1); return; }
  var lmd=e.target.closest?e.target.closest("[data-lpmedia]"):null;
  if(lmd){ lpCalMedia=lmd.getAttribute("data-lpmedia"); renderLpCal("stream",1); return; }
});

function searchIndex(){
  var out=[];
  ["reviews","news","craft","episodes"].forEach(function(k){ items(k).forEach(function(i){ out.push({k:k,i:i}); }); });
  return out;
}
function recentSearches(){ try{ return JSON.parse(localStorage.getItem("mim-recent")||"[]"); }catch(e){ return []; } }
function pushRecent(k,i){
  var r=recentSearches().filter(function(x){return !(x.k===k&&x.id===i.id);});
  r.unshift({k:k,id:i.id});
  try{ localStorage.setItem("mim-recent",JSON.stringify(r.slice(0,6))); }catch(e){}
}
function searchHit(k,it){
  var p=pic(k,it);
  return '<a class="s-hit" href="'+url(k,it)+'" data-nav data-searchhit data-k="'+k+'" data-id="'+esc(it.id)+'">'+
    (p?'<span class="th" style="background-image:url(\''+esc(p)+'\')"></span>':'<span class="th">MIM</span>')+
    '<span><h4>'+esc(it.t)+'</h4><span class="meta">'+esc(KIND[k].label)+'</span></span></a>';

function renderSearchResults(q){
  var res=document.getElementById("searchRes");
  q=(q||"").trim();
  if(!q){
    var rec=recentSearches().map(function(r){
      var it=(D[r.k]||[]).filter(function(x){return x.id===r.id;})[0];
      return it?{k:r.k,i:it}:null;
    }).filter(Boolean);
    if(!rec.length){ res.innerHTML='<div class="s-none">Напиши заглавие на филм, име на режисьор или тема.<b>Тук ще стоят и последните ти търсения.</b></div>'; return; }
    res.innerHTML='<div class="s-group">Последно търсено<button class="s-clear" id="sClear" type="button">Изчисти</button></div>'+
      rec.map(function(r){return searchHit(r.k,r.i);}).join("");
    var cl=document.getElementById("sClear");
    if(cl) cl.addEventListener("click",function(){ try{localStorage.removeItem("mim-recent");}catch(e){} renderSearchResults(""); });
    return;
  }
  var s=slugify(q);
  var hits=searchIndex().filter(function(x){
    return slugify(x.i.t).indexOf(s)>=0 || slugify(txt(x.i.lead)).indexOf(s)>=0;
  }).slice(0,20);
  if(!hits.length){ res.innerHTML='<div class="s-none">Нищо не е намерено за „'+esc(q)+'“.</div>'; return; }
  res.innerHTML='<div class="s-group">Резултати</div>'+hits.map(function(x){return searchHit(x.k,x.i);}).join("");
}

});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&document.getElementById("searchBox").classList.contains("open")){ closeSearch(); return; }
  if(e.key==="Escape"&&document.getElementById("hbtns").classList.contains("open")){ closeMenu(); return; }
  var tag=(document.activeElement&&document.activeElement.tagName||"").toLowerCase();
  if(e.key==="/"&&tag!=="input"&&tag!=="textarea"){ e.preventDefault(); openSearch(); }
});

/* входове към панела — водят към отделната страница /admin */
document.addEventListener("keydown",function(e){
  if(e.altKey&&(e.ctrlKey||e.metaKey)&&(e.key==="a"||e.key==="A")){ e.preventDefault(); location.href="/admin"; }
});
var _fc=0,_ft=null;
document.addEventListener("click",function(e){
  var f=e.target.closest?e.target.closest("footer"):null; if(!f) return;
  _fc++; clearTimeout(_ft); _ft=setTimeout(function(){_fc=0;},900);
  if(_fc>=3){ _fc=0; location.href="/admin"; }
});

(function boot(){
  if(location.protocol==="file:"){ chrome(); route(); return; }
  fetch("/api/content").then(function(r){return r.ok?r.json():null;}).then(function(raw){
    var n=normalize(raw);
    if(n&&n.reviews&&n.reviews.length) D=n;
    chrome(); route();
  }).catch(function(){ chrome(); route(); });
})();
</script>
